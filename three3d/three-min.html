<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirGuard 3D 校园孪生视图 · D1</title>
  <!-- three.js UMD + mqtt.js UMD，全部走 CDN，无本地静态文件 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #eef1f5;
      --panel-bg: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --nav-bg: #0f172a;
      --wait-bg: #f5f5f5;
      --wait-accent: #9ca3af;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ===== 顶部导航栏 ===== */
    .topbar {
      background: var(--nav-bg);
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 16px;
      padding: 12px 24px;
      flex-shrink: 0;
    }
    .topbar h1 { font-size: 18px; color: #fff; letter-spacing: .5px; }
    .topbar .sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    #conn { display: inline-flex; align-items: center; gap: 6px; color: #cbd5e1; font-size: 13px; }
    #conn .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--wait-accent);
    }
    #conn.on .dot { background: #22c55e; }
    #conn.off .dot { background: #ef4444; }

    /* ===== 主体：左侧数据面板 + 右侧 3D 画布 ===== */
    .layout {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 16px;
      padding: 16px 24px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }
    .side-panel {
      width: 300px;
      flex-shrink: 0;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      overflow-y: auto;
    }
    .side-panel h2 {
      font-size: 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .zone-id { font-size: 11px; color: var(--muted); font-family: Consolas, monospace; }
    .zone-item {
      border: 1px solid var(--border);
      border-left: 4px solid var(--wait-accent);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      background: var(--wait-bg);
    }
    .zi-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }
    .zi-head b { font-size: 15px; }
    .zi-badge {
      font-size: 12px;
      color: #fff;
      background: var(--wait-accent);
      padding: 2px 9px;
      border-radius: 999px;
      margin-left: auto;
      white-space: nowrap;
    }
    .zi-metrics { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
    .zi-metrics li { font-size: 12px; color: var(--muted); }
    .zi-metrics .full { grid-column: 1 / -1; }
    .zi-metrics b {
      display: block;
      font-size: 14px;
      color: var(--text);
      font-weight: 600;
    }
    .zi-metrics .full b { font-size: 12px; font-weight: 500; }
    .zi-empty { color: var(--muted); font-size: 13px; }

    /* ===== D2 优先关注（左侧面板） ===== */
    .d2-title { margin-top: 16px; }
    #d2-priority { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    #d2-priority .d2-win { color: #c62828; }
    #d2-priority .d2-none { color: var(--muted); font-weight: 400; }
    #d2-reason { font-size: 12px; color: var(--muted); line-height: 1.6; }

    /* ===== D3 事件状态（左侧面板 + 点击建筑弹窗） ===== */
    .tag {
      font-size: 11px;
      color: #475569;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 1px 6px;
      margin-left: 8px;
      vertical-align: 2px;
    }
    #d3-panel { display: grid; gap: 6px; margin-top: 4px; }
    .d3-line { font-size: 12px; color: var(--muted); padding: 4px 8px; border-radius: 6px; background: #f8fafc; }
    .d3-line.open { color: #374151; border: 1px solid #e5e7eb; background: #ffffff; }
    .d3-line.handling { color: #b45309; background: #fff7e6; border: 1px solid #fcd34d; }
    .d3-line.ok { color: #2e7d32; background: #e8f5e9; }
    .d3-line.off { color: #c62828; background: #ffebee; }
    .d3-info {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 4;
      max-width: 300px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    }
    .d3-info b.zname { font-size: 13px; }
    .d3-info .info-row { margin-top: 2px; }
    .d3-info .focus-reset {
      margin-top: 8px;
      font-size: 12px;
      padding: 4px 12px;
      border: 1px solid #2563eb;
      color: #2563eb;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }
    .d3-info .focus-reset:hover { background: #2563eb; color: #fff; }

    /* ===== D4 链路状态（左侧面板） ===== */
    #d4-panel { display: grid; gap: 6px; margin-top: 4px; }
    .d4-line { font-size: 12px; color: var(--muted); padding: 4px 8px; border-radius: 6px; background: #f8fafc; }
    .d4-line.on { color: #2e7d32; background: #e8f5e9; }
    .d4-line.off { color: #c62828; background: #ffebee; }

    /* ===== D5 规则与ML（左侧面板） ===== */
    #d5-panel { display: grid; gap: 6px; margin-top: 4px; }
    .d5-line { font-size: 12px; color: var(--muted); padding: 4px 8px; border-radius: 6px; background: #f8fafc; }
    .d5-line.conflict { color: #b45309; background: #fff7e6; border: 1px solid #fcd34d; }
    .d4-btn {
      margin-top: 8px;
      font-size: 12px;
      padding: 5px 14px;
      border: 1px solid #2563eb;
      color: #2563eb;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
    }
    .d4-btn:hover { background: #2563eb; color: #fff; }

    .canvas-wrap {
      flex: 1;
      min-width: 0;
      position: relative;
      background: #eef1f5;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .canvas-wrap .op-hint {
      position: absolute;
      right: 12px;
      bottom: 10px;
      font-size: 11px;
      color: var(--muted);
      pointer-events: none;
      z-index: 2;
    }
    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 13px;
      text-align: center;
      z-index: 3;
      background: var(--bg);
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .layout { flex-direction: column; }
      .side-panel { width: auto; max-height: 45vh; }
      .canvas-wrap { min-height: 55vh; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>AirGuard 3D 校园孪生视图</h1>
      <div class="sub">D1 · MQTT 实时数据驱动 · 拖拽旋转 / 滚轮缩放</div>
    </div>
    <span id="conn"><span class="dot"></span><span id="conn-text">连接中…</span></span>
  </header>

  <main class="layout">
    <aside class="side-panel">
      <h2>区域实时数据</h2>
      <div id="zone-panel"></div>

      <!-- D2 持续风险与优先关注：优先区域建筑会在 3D 场景中闪烁标记 -->
      <h2 class="d2-title">D2 优先关注<span class="tag">D2</span></h2>
      <div id="d2-priority"></div>
      <div id="d2-reason"></div>

      <!-- D3 干预—验证—恢复：OPEN 白框 / HANDLING 橙色闪烁 / RECOVERED 恢复原色 -->
      <h2 class="d2-title">D3 事件状态<span class="tag">D3</span></h2>
      <div id="d3-panel"></div>

      <!-- D4 实时链路：MQTT 连接状态 + 各区域在线/离线 + 手动重连 -->
      <h2 class="d2-title">D4 链路状态<span class="tag">D4</span></h2>
      <div id="d4-panel"></div>
      <button id="btn-reconnect" class="d4-btn" type="button">手动重连</button>

      <!-- D5 固定规则与ML辅助判断：不一致时建筑黄色闪烁提醒 -->
      <h2 class="d2-title">D5 规则与ML<span class="tag">D5</span></h2>
      <div id="d5-panel"></div>
    </aside>
    <section class="canvas-wrap" id="canvas-wrap">
      <div id="three-fallback" class="placeholder" style="display:none">Three.js CDN 加载失败，请检查网络后刷新</div>
      <div class="op-hint">拖拽旋转 · 滚轮缩放 · 点击建筑聚焦查看</div>
      <!-- 点击建筑后显示该区域 D3 事件详情 -->
      <div id="d3-info" class="d3-info" style="display:none"></div>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      // ============ MQTT / 数据契约配置 ============
      const MQTT_URL = 'ws://127.0.0.1:8083/mqtt';
      const TOPIC = 'airguard/+/env';
      // D3 干预指令主题：总视图点击干预后广播，本页同步进入 HANDLING
      const ACTION_TOPIC = 'airguard/+/action';

      const ZONES = {
        'zone-n': { name: '宿舍区' },
        'zone-s': { name: '教学区' },
        'zone-w': { name: '食堂区' },
      };
      const ZONE_IDS = Object.keys(ZONES);

      // 三区域状态独立存储，只按 zone 键更新，严禁串数据
      const zoneState = ZONE_IDS.reduce(function (acc, z) { acc[z] = null; return acc; }, {});

      // 立方体颜色（任务书规定）；文字/面板强调色
      const STATUS_COLORS = {
        '正常': 0x81c784,
        '轻度污染': 0xffd54f,
        '重度污染': 0xe53935,
        '通风不足风险': 0xba68c8,
      };
      const STATUS_BG = {
        '正常': '#e8f5e9',
        '轻度污染': '#fff8e1',
        '重度污染': '#ffebee',
        '通风不足风险': '#f3e5f5',
      };
      const STATUS_ACCENT = {
        '正常': '#2e7d32',
        '轻度污染': '#f57f17',
        '重度污染': '#c62828',
        '通风不足风险': '#7b1fa2',
      };
      const WAIT_COLOR = 0x9e9e9e;
      const WAIT_BG = '#f5f5f5';
      const WAIT_ACCENT = '#9ca3af';

      const CROWD_LEVELS = { 0: '稀疏', 1: '正常', 2: '拥挤', 3: '严重拥挤' };

      // 风险强度（热力图透明度依据）与处置过程文案（任务书：热力图/色彩表达风险、状态、处置过程）
      const RISK_SCORE = { '重度污染': 4, '轻度污染': 2.5, '通风不足风险': 3, '正常': 0.5 };
      const DISPOSALS = {
        '正常': '常规监测，无需处置',
        '轻度污染': '提醒通风 · 敏感人群减少停留',
        '重度污染': '开启净化 · 疏散户外人群',
        '通风不足风险': '开启新风 / 开窗通风',
      };
      // 区域 → 空间对象对应关系（楼栋 / 通道 / 操场 / 食堂窗口）
      const ZONE_OBJECTS = {
        'zone-n': '宿舍楼栋 · 通道',
        'zone-s': '教学楼 · 操场 · 通道',
        'zone-w': '食堂 · 售卖窗口 · 通道',
      };

      // ============ D2 持续风险与优先关注 ============
      // crowdLevel 保留 source 标记：simulated / rule，置信度 1.0（规则判定直接采用上报值）
      // 打分规则写死在程序中，可解释、可重复：更换输入数据，优先区域随之变化
      const ENV_BASE_SCORE = { '重度污染': 10, '轻度污染': 6, '通风不足风险': 4, '正常': 0 };
      const CROWD_BONUS_SCORE = { 0: 0, 1: 1, 2: 3, 3: 5 }; // 3（严重拥挤）在拥挤之上延展 +5
      const PERSIST_BONUS = 2;        // 连续异常 ≥2 次的额外加成
      const PERSIST_THRESHOLD = 2;
      const STATUS_SEVERITY = { '重度污染': 3, '轻度污染': 2, '通风不足风险': 1, '正常': 0 };

      // 每个 zone 独立的 D2 状态（连续异常计数 + 风险总分），区域数据隔离、互不干扰
      const d2State = ZONE_IDS.reduce(function (acc, z) {
        acc[z] = { anomalyCount: 0, score: 0, source: 'simulated', confidence: 1.0, review: false };
        return acc;
      }, {});

      // ============ D3 干预—验证—恢复状态机 ============
      // 状态转移硬编码（禁止非法跳转）：
      //   无事件 --新异常--> OPEN --点击干预(人工)--> HANDLING --数据满足恢复条件--> RECOVERED
      //   HANDLING --新数据显示异常仍在--> OPEN（干预无效，允许回退）
      //   禁止：OPEN 直接到 RECOVERED；已 RECOVERED 事件迟到/重复消息不回滚（仅补充历史记录）
      const D3_STATE = { OPEN: 'OPEN', HANDLING: 'HANDLING', RECOVERED: 'RECOVERED' };
      const D3_RECOVER_STREAK = 2; // 连续正常报文次数阈值

      const d3Events = {};        // zone → 活跃事件（OPEN / HANDLING）；RECOVERED 后置 null
      const d3History = [];       // 已恢复事件历史（RECOVERED）
      const zoneLastMsgTime = {}; // zone → 最近报文 time（乱序判断）
      const zoneLastMsgKey = {};  // zone → 最近报文去重键（重复判断）

      // ============ D4 实时链路故障与修复 ============
      // 故障场景：区域节点长时间断流（超过阈值不再上报数据）
      // 流程：观察现象（离线判定/灰显）→ 定位原因 → 修复 → 重新运行 → 验证恢复
      const D4_OFFLINE_THRESHOLD = 120000; // 2 分钟无新数据 → 节点离线
      const d4LastSeen = {};   // zone → 最后收到报文的 Date
      const d4Online = {};     // zone → 在线状态（定时器维护）
      let mqttConnState = '';  // '' | 'on' | 'off'（Broker 连接状态）
      ZONE_IDS.forEach(function (z) { d4LastSeen[z] = null; d4Online[z] = false; });

      // ============ D5 固定规则与ML辅助判断 ============
      // 两套判断并行：固定阈值规则（pm25>75 或 co2>1000 → 环境异常）
      //              轻量统计ML（当前值 vs 历史均值 + 倍数×标准差）
      // crowdLevel 为独立附加数据，不参与 D5 规则/ML 对比，仅页面展示
      const D5_HISTORY_MAX = 60; // 每个 zone 历史数组上限（防内存溢出）
      const D5_MIN_SAMPLES = 6;  // 判定所需最少历史样本数（统计时排除当前值）
      const D5_DEFAULT_MULT = 2;
      let d5Mult = D5_DEFAULT_MULT; // 标准差倍数（总视图 UI 可调，此处用默认值）
      const d5State = ZONE_IDS.reduce(function (acc, z) {
        acc[z] = {
          pm25Hist: [], co2Hist: [],
          lastTime: null,
          rule: '—', ml: '—', mismatch: false,
          pm25: null, co2: null, pmThr: null, co2Thr: null,
        };
        return acc;
      }, {});

      // ============ DOM ============
      const $conn = document.getElementById('conn');
      const $connText = document.getElementById('conn-text');
      const $zonePanel = document.getElementById('zone-panel');
      const $canvasWrap = document.getElementById('canvas-wrap');
      const $d2Priority = document.getElementById('d2-priority');
      const $d2Reason = document.getElementById('d2-reason');
      const $d4Panel = document.getElementById('d4-panel');

      // ============ status 计算（任务书顺序，仅用 pm25 / co2） ============
      function calcStatus(pm25, co2) {
        if (pm25 > 150) return '重度污染';
        if (pm25 > 75) return '轻度污染';
        if (co2 >= 1500) return '通风不足风险';
        return '正常';
      }

      function crowdText(crowdLevel) {
        if (crowdLevel === undefined || crowdLevel === null || crowdLevel === '') return '--';
        const v = Number(crowdLevel);
        return Object.prototype.hasOwnProperty.call(CROWD_LEVELS, v) ? CROWD_LEVELS[v] : crowdLevel;
      }

      const fmt = function (x) { return (x === undefined || x === null || x === '' ? '--' : x); };

      function setConn(state, text) {
        $conn.className = state;
        $connText.textContent = text || (
          state === 'on' ? '已连接 ' + MQTT_URL :
          state === 'off' ? '连接断开，自动重连中…' : '连接中…'
        );
        // D4：Broker 连接状态变化 → 控制台日志 + 面板刷新（仅在状态真正变化时记录）
        if (state === 'on' && mqttConnState !== 'on') {
          console.log('[AirGuard] D4 故障日志: [Broker连接] MQTT Broker 连接成功');
        } else if (state === 'off' && mqttConnState === 'on') {
          console.log('[AirGuard] D4 故障日志: [Broker断开] MQTT Broker 连接断开，自动重连中…');
        }
        mqttConnState = state;
        renderD4Panel();
      }

      // 数据契约字段为 zoneId；兼容小写 zoneid；缺失时退回 topic 中间段；不认识则丢弃
      function resolveZone(topic, payload) {
        const z = (payload && (payload.zoneId || payload.zoneid)) || topic.split('/')[1] || '';
        return Object.prototype.hasOwnProperty.call(ZONES, z) ? z : null;
      }

      // ============ 3D 场景 ============
      let scene, camera, renderer;
      const buildings = {}; // zone → { group, walls }（建筑组 + 随状态变色的墙体贴图）
      let clockFace = null; // 教学区钟楼钟盘纹理（每 30 秒对时）
      const heatSpots = {}; // zone → 地面风险热力光斑（径向渐变 Canvas 贴图）
      const labels = {};    // zone → 文字标签
      const highlightShells = {}; // zone → D2 优先关注高亮壳（轻微闪烁标记重点区域）
      const d3Shells = {};        // zone → D3 状态标记壳（OPEN 白框 / HANDLING 橙闪 / RECOVERED 隐藏）
      const d3ShellState = {};    // zone → null | 'OPEN' | 'HANDLING'
      const d5Shells = {};        // zone → D5 规则/ML 不一致黄色闪烁提醒壳
      const d5ShellState = {};    // zone → 是否不一致（true 时黄闪）

      // ============ E1 地图/3D 数字空间增强 ============
      // 建筑横向位置（从 initScene 提取到模块级，供相机聚焦使用）
      const POS = { 'zone-n': -14, 'zone-s': 0, 'zone-w': 14 };
      // 建筑外框：环境正常绿框 / 环境异常红框 / D3 处理中黄闪 / 已恢复平滑渐变回正常色
      const OUTLINE_NORMAL = 0x22c55e;
      const OUTLINE_ABNORMAL = 0xef4444;
      const OUTLINE_HANDLING = 0xffd600;
      // THREE CDN 加载失败时置 null（仅在 3D 渲染路径使用，不阻塞 MQTT 面板）
      const OUTLINE_HANDLING_COL = window.THREE ? new THREE.Color(OUTLINE_HANDLING) : null;
      const OUTLINE_HANDLING_LIGHT = window.THREE ? new THREE.Color(0xfff3b0) : null;
      const OUTLINE_WAIT = 0x9ca3af;
      const OUTLINE_RECOVER_MS = 1200; // 恢复渐变时长
      // 人流密度光圈：crowdLevel 越大，光圈尺寸越大、闪烁越快
      const CROWD_RING_COLORS = { 0: 0x90a4ae, 1: 0x66bb6a, 2: 0xfb8c00, 3: 0xe53935 };
      const RING_INNER = { 'zone-n': 4.6, 'zone-s': 5.8, 'zone-w': 5.8 };
      const RING_THICK = 0.55;
      const outlines = {};     // zone → { mesh, color, targetColor, recover }
      const crowdRings = {};   // zone → { mesh, level, cur, target }
      const glowSprites = {};  // zone → D2 优先关注发光光晕（加色混合）
      // 相机聚焦：点击建筑平滑移动镜头（轨道参数在 animate 中插值）
      const focusFrom = window.THREE ? new THREE.Vector3() : null;
      const focusTo = window.THREE ? new THREE.Vector3() : null;
      let focusT = 1;
      let focusFromRadius = 34;
      let focusToRadius = 34;
      let lastFrame = performance.now();
      let infoZone = null;     // 当前悬浮信息面板对应区域（面板打开期间随报文实时刷新）
      let d3InfoTimer = null;
      let priorityZone = null;    // 当前优先关注区域
      const SHELL_SIZES = {
        'zone-n': [7.2, 5.8, 10.4],  // 宿舍区包围盒
        'zone-s': [11.8, 13.4, 7.8], // 教学区包围盒
        'zone-w': [11.8, 7.8, 7.8],  // 食堂区包围盒
      };
      const TARGET = new THREE.Vector3(0, 3, 0);
      let theta = 0.8, phi = 1.05, radius = 34; // 轨道参数：水平角 / 俯仰角 / 距离
      let dragging = false, lastX = 0, lastY = 0;

      function initScene() {
        if (!window.THREE) {
          document.getElementById('three-fallback').style.display = 'flex';
          return;
        }
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeef1f5);

        camera = new THREE.PerspectiveCamera(45, $canvasWrap.clientWidth / $canvasWrap.clientHeight, 0.1, 300);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize($canvasWrap.clientWidth, $canvasWrap.clientHeight);
        $canvasWrap.appendChild(renderer.domElement);

        // 灯光（暖色半球光 + 暖阳方向光，开启柔和阴影）
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        scene.add(new THREE.HemisphereLight(0xffffff, 0xd8e8c8, 0.7));
        const dirLight = new THREE.DirectionalLight(0xfff3dc, 1.0);
        dirLight.position.set(15, 25, 12);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(1024, 1024);
        dirLight.shadow.camera.left = -30;
        dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.top = 30;
        dirLight.shadow.camera.bottom = -30;
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 80;
        scene.add(dirLight);

        // 天空渐变背景 + 草地 + 暖色步行道 + 树木灌木 + 远景雾
        scene.background = makeSkyTexture();

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(160, 120),
          new THREE.MeshLambertMaterial({ color: 0xa5d6a7 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 建筑前横向步行道（暖沙色）
        const walkway = mesh(new THREE.BoxGeometry(56, 0.02, 1.6), lambert(0xeee3cc), 0, 0.011, 5.5);
        walkway.castShadow = false;
        walkway.receiveShadow = true;
        scene.add(walkway);
        // 各建筑与步行道之间的连接小路
        ZONE_IDS.forEach(function (z, i) {
          const stub = mesh(new THREE.BoxGeometry(1.2, 0.02, 2.2), lambert(0xeee3cc), [-14, 0, 14][i], 0.011, 4.8);
          stub.castShadow = false;
          stub.receiveShadow = true;
          scene.add(stub);
        });
        // 教学区 → 操场通道
        const fieldPath = mesh(new THREE.BoxGeometry(1.2, 0.02, 11.2), lambert(0xeee3cc), 0, 0.011, -0.95);
        fieldPath.castShadow = false;
        fieldPath.receiveShadow = true;
        scene.add(fieldPath);

        // 操场（教学区对应空间对象）：椭圆形跑道 + 绿色内场
        scene.add(buildPlayground());

        // 低多边形树木与灌木（环绕布置，不遮挡建筑，避开操场）
        const TREES = [
          [-18, -6.5, 1.0], [-13, -7.0, 1.15], [-7, -17.0, 0.9],
          [7, -17.0, 0.9], [13, -7.0, 1.15], [18, -6.5, 1.0],
          [-9.5, -11.0, 0.95], [9.5, -11.0, 0.95],
          [-14, 8.8, 1.1], [0, 8.8, 1.25], [14, 8.8, 1.1],
          [-23, 1, 0.85], [23, 1, 0.85],
        ];
        TREES.forEach(function (t) {
          const tree = makeTree(t[2]);
          tree.position.set(t[0], 0, t[1]);
          scene.add(tree);
        });
        const BUSHES = [[-18, 6.8], [-9, 6.8], [0, 6.8], [9, 6.8], [18, 6.8]];
        BUSHES.forEach(function (b, i) {
          scene.add(mesh(new THREE.SphereGeometry(0.32, 8, 8), lambert(i % 2 ? 0x81c784 : 0x66bb6a), b[0], 0.32, b[1]));
        });

        scene.fog = new THREE.Fog(0xe3eef7, 80, 160);

        // 三个特色建筑：左宿舍区、中教学区、右食堂区；顶部为 2D 文字标签
        const LABEL_Y = { 'zone-n': 6.8, 'zone-s': 14.4, 'zone-w': 8.9 };
        const BUILDERS = { 'zone-n': buildDormitory, 'zone-s': buildTeaching, 'zone-w': buildCanteen };
        ZONE_IDS.forEach(function (z) {
          const b = BUILDERS[z]();
          b.group.position.x = POS[z];
          scene.add(b.group);
          buildings[z] = b;

          labels[z] = makeLabel();
          labels[z].sprite.position.set(POS[z], LABEL_Y[z], 0);
          scene.add(labels[z].sprite);

          // 地面风险热力光斑（初始无数据，透明）
          heatSpots[z] = makeHeatSpot();
          heatSpots[z].mesh.position.set(POS[z], 0.015, 0);
          scene.add(heatSpots[z].mesh);

          // D2 优先关注高亮壳（透明，仅当该区域为优先关注时闪烁）
          const shell = new THREE.Mesh(
            new THREE.BoxGeometry(SHELL_SIZES[z][0], SHELL_SIZES[z][1], SHELL_SIZES[z][2]),
            new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0, depthWrite: false })
          );
          shell.position.set(POS[z], SHELL_SIZES[z][1] / 2, 0);
          scene.add(shell);
          highlightShells[z] = shell;

          // D3 状态标记壳（略大于 D2 壳）：OPEN 白框 / HANDLING 橙闪 / RECOVERED 恢复原色（隐藏）
          const d3Shell = new THREE.Mesh(
            new THREE.BoxGeometry(SHELL_SIZES[z][0] * 1.05, SHELL_SIZES[z][1] * 1.05, SHELL_SIZES[z][2] * 1.05),
            new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false })
          );
          d3Shell.position.set(POS[z], SHELL_SIZES[z][1] / 2, 0);
          scene.add(d3Shell);
          d3Shells[z] = d3Shell;
          d3ShellState[z] = null;

          // D5 规则/ML 不一致黄色闪烁提醒壳（最外层）
          const d5Shell = new THREE.Mesh(
            new THREE.BoxGeometry(SHELL_SIZES[z][0] * 1.12, SHELL_SIZES[z][1] * 1.12, SHELL_SIZES[z][2] * 1.12),
            new THREE.MeshBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0, depthWrite: false })
          );
          d5Shell.position.set(POS[z], SHELL_SIZES[z][1] / 2, 0);
          scene.add(d5Shell);
          d5Shells[z] = d5Shell;
          d5ShellState[z] = false;

          // E1 建筑外框（包围盒线框）：正常绿 / 异常红 / HANDLING 黄闪 / 恢复平滑渐变
          const outlineMesh = new THREE.LineSegments(
            new THREE.EdgesGeometry(new THREE.BoxGeometry(
              SHELL_SIZES[z][0] * 1.02, SHELL_SIZES[z][1] * 1.02, SHELL_SIZES[z][2] * 1.02)),
            new THREE.LineBasicMaterial({ color: OUTLINE_WAIT, transparent: true, opacity: 0.85 })
          );
          outlineMesh.position.set(POS[z], SHELL_SIZES[z][1] / 2, 0);
          scene.add(outlineMesh);
          outlines[z] = {
            mesh: outlineMesh,
            color: new THREE.Color(OUTLINE_WAIT),
            targetColor: new THREE.Color(OUTLINE_WAIT),
            recover: null,
          };

          // E1 人流密度光圈（地面环形）：crowdLevel 越大尺寸越大、闪烁越快
          const ringMesh = new THREE.Mesh(
            new THREE.RingGeometry(RING_INNER[z], RING_INNER[z] + RING_THICK, 48),
            new THREE.MeshBasicMaterial({
              color: 0x90a4ae, transparent: true, opacity: 0,
              side: THREE.DoubleSide, depthWrite: false,
            })
          );
          ringMesh.rotation.x = -Math.PI / 2;
          ringMesh.position.set(POS[z], 0.03, 0);
          scene.add(ringMesh);
          crowdRings[z] = { mesh: ringMesh, level: null, cur: 1, target: 1 };

          // E1 D2 优先关注发光光晕（加色混合脉冲，叠加在原有高亮壳之上）
          const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
            map: makeGlowTexture(),
            color: 0xef4444,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0,
            depthWrite: false,
          }));
          glowSprite.scale.set(13, 13, 1);
          glowSprite.position.set(POS[z], SHELL_SIZES[z][1] + 2.5, 0);
          scene.add(glowSprite);
          glowSprites[z] = glowSprite;
        });

        // 自定义简单控制器：拖拽旋转 + 滚轮缩放
        const el = renderer.domElement;
        el.style.cursor = 'grab';
        el.addEventListener('pointerdown', function (e) {
          dragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
          el.style.cursor = 'grabbing';
          el.setPointerCapture(e.pointerId);
        });
        el.addEventListener('pointermove', function (e) {
          if (!dragging) return;
          theta -= (e.clientX - lastX) * 0.005;
          phi = Math.min(1.5, Math.max(0.2, phi - (e.clientY - lastY) * 0.005));
          lastX = e.clientX;
          lastY = e.clientY;
        });
        el.addEventListener('pointerup', function (e) {
          const wasDrag = Math.abs(e.clientX - lastX) > 5 || Math.abs(e.clientY - lastY) > 5;
          dragging = false;
          el.style.cursor = 'grab';
          el.releasePointerCapture(e.pointerId);
          if (wasDrag) return;
          // 点击（非拖拽）：拾取建筑，查看该区域 D3 事件
          const rect = el.getBoundingClientRect();
          const rayMouse = new THREE.Vector2(
            ((e.clientX - rect.left) / rect.width) * 2 - 1,
            -((e.clientY - rect.top) / rect.height) * 2 + 1
          );
          const ray = new THREE.Raycaster();
          ray.setFromCamera(rayMouse, camera);
          for (let i = 0; i < ZONE_IDS.length; i++) {
            const z = ZONE_IDS[i];
            if (ray.intersectObject(buildings[z].group, true).length > 0) {
              focusCameraOn(z); // E1：相机平滑移动聚焦到该建筑
              d3ShowEventInfo(z);
              return;
            }
          }
        });
        el.addEventListener('wheel', function (e) {
          e.preventDefault();
          radius = Math.min(70, Math.max(12, radius * (1 + e.deltaY * 0.001)));
        }, { passive: false });

        window.addEventListener('resize', function () {
          camera.aspect = $canvasWrap.clientWidth / $canvasWrap.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize($canvasWrap.clientWidth, $canvasWrap.clientHeight);
        });

        animate();
      }

      function makeLabel() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 224;
        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
          map: texture,
          depthTest: false,
          transparent: true,
        }));
        sprite.scale.set(10, 10 * 224 / 512, 1);
        return { canvas: canvas, texture: texture, sprite: sprite };
      }

      function updateLabel(label, zone, d, offline, mlConflict) {
        const ctx = label.canvas.getContext('2d');
        ctx.clearRect(0, 0, 512, 224);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // 第一行：区域名；第二行：状态（按状态色，离线灰显，ML不一致追加标注）；第三行：处置过程 / 断流提示
        ctx.font = 'bold 44px "Microsoft YaHei", "Segoe UI", sans-serif';
        ctx.fillStyle = '#1f2937';
        ctx.fillText(ZONES[zone].name, 256, 46);
        ctx.font = 'bold 38px "Microsoft YaHei", "Segoe UI", sans-serif';
        ctx.fillStyle = offline ? WAIT_ACCENT : (d ? (STATUS_ACCENT[d.status] || WAIT_ACCENT) : WAIT_ACCENT);
        ctx.fillText(offline ? '已离线' : (d ? (d.status + (mlConflict ? ' · ML不一致' : '')) : '暂无数据'), 256, 98);
        ctx.font = '26px "Microsoft YaHei", "Segoe UI", sans-serif';
        ctx.fillStyle = '#37474f';
        if (offline) {
          ctx.fillText('节点断流 · 等待恢复', 256, 152);
        } else if (d) {
          ctx.fillText(DISPOSALS[d.status] || '—', 256, 152);
        }
        label.texture.needsUpdate = true;
      }

      function updateScene() {
        if (!renderer) return;
        ZONE_IDS.forEach(function (z) {
          const d = zoneState[z];
          const online = !!d4Online[z];
          // 离线节点：模型灰显，不再更新实时数据
          const eff = online ? d : null;
          const hex = eff
            ? (STATUS_COLORS[eff.status] !== undefined ? STATUS_COLORS[eff.status] : WAIT_COLOR)
            : WAIT_COLOR;
          // 重绘该区域所有墙体贴图（换色），屋顶/底座保持中性色
          buildings[z].walls.forEach(function (w) { repaintWall(w, hex); });
          // 地面热力光斑同步表达风险（离线清空）
          updateHeatSpot(heatSpots[z], eff);
          updateLabel(labels[z], z, eff, !online,
            !online ? false : !!(d5State[z] && d5State[z].mismatch));
          // D2 高亮壳颜色随状态强调色（是否可见由 animate 闪烁控制）
          if (highlightShells[z]) {
            highlightShells[z].material.color.set(
              eff ? (STATUS_ACCENT[eff.status] || WAIT_ACCENT) : WAIT_ACCENT
            );
          }
          // E1 外框目标色：正常绿 / 异常红 / 无数据或离线灰（黄闪与恢复渐变在 animate 中处理）
          outlines[z].targetColor.set(
            eff ? (eff.status === '正常' ? OUTLINE_NORMAL : OUTLINE_ABNORMAL) : OUTLINE_WAIT
          );
          // E1 人流光圈：等级越大尺寸越大、闪烁越快；无数据或离线隐藏
          const lv = eff ? Math.min(3, Math.max(0, Number(eff.crowdLevel) || 0)) : null;
          crowdRings[z].level = lv;
          crowdRings[z].target = lv === null ? 1 : 1 + lv * 0.25;
          if (lv !== null) crowdRings[z].mesh.material.color.set(CROWD_RING_COLORS[lv]);
        });
      }

      // ============ E1：相机聚焦 / 外框恢复渐变 ============
      // 点击建筑：相机平滑移动并聚焦到该建筑（轨道参数在 animate 中插值）
      function focusCameraOn(zone) {
        focusFrom.copy(TARGET);
        focusTo.set(POS[zone], SHELL_SIZES[zone][1] / 2, 0);
        focusFromRadius = radius;
        focusToRadius = 18;
        lastFrame = performance.now();
        focusT = 0;
      }

      // 回到全景视角（悬浮面板按钮）
      function resetCameraFocus() {
        focusFrom.copy(TARGET);
        focusTo.set(0, 3, 0);
        focusFromRadius = radius;
        focusToRadius = 34;
        lastFrame = performance.now();
        focusT = 0;
      }

      // D3 已恢复：外框从处理中黄色平滑渐变回正常色（缓动 1.2 秒）
      function startOutlineRecover(zone) {
        const o = outlines[zone];
        if (!o) return;
        o.recover = { start: performance.now(), from: new THREE.Color(OUTLINE_HANDLING) };
      }

      // ============ 墙体贴图（Canvas 生成窗户网格，随状态重绘换色） ============
      function makeWall(rows, cols) {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        const wall = { canvas: canvas, texture: texture, rows: rows, cols: cols };
        repaintWall(wall, WAIT_COLOR);
        return wall;
      }

      function repaintWall(wall, hex) {
        const ctx = wall.canvas.getContext('2d');
        const s = wall.canvas.width;
        ctx.fillStyle = '#' + hex.toString(16).padStart(6, '0');
        ctx.fillRect(0, 0, s, s);
        // 深色窗户网格
        ctx.fillStyle = '#263238';
        const pad = 10;
        const gx = (s - pad * 2) / wall.cols;
        const gy = (s - pad * 2) / wall.rows;
        for (let r = 0; r < wall.rows; r++) {
          for (let c = 0; c < wall.cols; c++) {
            ctx.fillRect(pad + c * gx + gx * 0.15, pad + r * gy + gy * 0.15, gx * 0.7, gy * 0.7);
          }
        }
        wall.texture.needsUpdate = true;
      }

      // ============ 环境辅助：天空渐变 + 低多边形树木 ============
      function makeSkyTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 2;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const g = ctx.createLinearGradient(0, 0, 0, 512);
        g.addColorStop(0, '#7ec3ee');   // 顶部天蓝
        g.addColorStop(0.55, '#bfe0f5'); // 中部浅蓝
        g.addColorStop(1, '#fdf6e3');   // 地平线暖白
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 2, 512);
        return new THREE.CanvasTexture(canvas);
      }

      function makeTree(s) {
        const g = new THREE.Group();
        g.add(mesh(new THREE.CylinderGeometry(0.14, 0.18, 0.9, 8), lambert(0x8d6e63), 0, 0.45, 0));
        g.add(mesh(new THREE.ConeGeometry(0.85, 1.6, 7), lambert(0x66bb6a), 0, 1.5, 0));
        g.add(mesh(new THREE.ConeGeometry(0.6, 1.2, 7), lambert(0x81c784), 0, 2.3, 0));
        g.scale.setScalar(s);
        return g;
      }

      function buildPlayground() {
        const group = new THREE.Group();

        // 椭圆形环形跑道：外椭圆挖去内椭圆，挤压成薄环
        const trackShape = new THREE.Shape();
        trackShape.absellipse(0, 0, 9, 5.6, 0, Math.PI * 2, false);
        const trackHole = new THREE.Path();
        trackHole.absellipse(0, 0, 6.2, 3.2, 0, Math.PI * 2, true);
        trackShape.holes.push(trackHole);
        const track = mesh(
          new THREE.ExtrudeGeometry(trackShape, { depth: 0.06, bevelEnabled: false }),
          lambert(0xc88b7a), 0, 0, 0
        );
        track.rotation.x = -Math.PI / 2; // 挤压方向转至竖直向上
        group.add(track);

        // 跑道内圈整片草皮（椭圆，填满内圈不留空地）
        const infieldShape = new THREE.Shape();
        infieldShape.absellipse(0, 0, 6.15, 3.15, 0, Math.PI * 2, false);
        const infield = mesh(new THREE.ShapeGeometry(infieldShape), lambert(0x7cb96e), 0, 0.066, 0);
        infield.rotation.x = -Math.PI / 2;
        group.add(infield);

        // 足球场白线：矩形边线 + 中线
        const lineShape = new THREE.Shape();
        lineShape.moveTo(-4.0, -2.25);
        lineShape.lineTo(4.0, -2.25);
        lineShape.lineTo(4.0, 2.25);
        lineShape.lineTo(-4.0, 2.25);
        lineShape.closePath();
        const lineHole = new THREE.Path();
        lineHole.moveTo(-3.94, -2.19);
        lineHole.lineTo(-3.94, 2.19);
        lineHole.lineTo(3.94, 2.19);
        lineHole.lineTo(3.94, -2.19);
        lineHole.closePath();
        lineShape.holes.push(lineHole);
        const line = mesh(
          new THREE.ExtrudeGeometry(lineShape, { depth: 0.005, bevelEnabled: false }),
          lambert(0xf5f5f5), 0, 0.066, 0
        );
        line.rotation.x = -Math.PI / 2;
        group.add(line);
        group.add(mesh(new THREE.BoxGeometry(0.06, 0.004, 4.5), lambert(0xf5f5f5), 0, 0.068, 0));

        group.position.set(0, 0, -11);
        return group;
      }

      // ============ 地面风险热力光斑（径向渐变，用热力图表达风险与状态） ============
      function makeGlowTexture() {
        // 径向渐变白晕贴图，配合加色混合实现 D2 优先关注发光效果
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        const g = ctx.createRadialGradient(128, 128, 8, 128, 128, 122);
        g.addColorStop(0, 'rgba(255,255,255,0.95)');
        g.addColorStop(0.4, 'rgba(255,255,255,0.35)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 256, 256);
        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        return texture;
      }

      function rgba(hex, a) {
        const n = parseInt(hex.slice(1), 16);
        return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
      }

      function makeHeatSpot() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        const spotMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(13, 13),
          new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false })
        );
        spotMesh.rotation.x = -Math.PI / 2;
        return { canvas: canvas, texture: texture, mesh: spotMesh };
      }

      function updateHeatSpot(spot, d) {
        const ctx = spot.canvas.getContext('2d');
        ctx.clearRect(0, 0, 256, 256);
        if (!d) {
          spot.texture.needsUpdate = true;
          return;
        }
        // 风险强度 = 状态严重度 + 人流，映射为光斑透明度
        const sev = RISK_SCORE[d.status] !== undefined ? RISK_SCORE[d.status] : 0.5;
        const crowd = Number(d.crowdLevel) >= 0 ? Number(d.crowdLevel) : 0;
        const alpha = Math.min(0.85, 0.18 + (sev + crowd * 0.8) * 0.13);
        const color = STATUS_ACCENT[d.status] || WAIT_ACCENT;
        const g = ctx.createRadialGradient(128, 128, 8, 128, 128, 122);
        g.addColorStop(0, rgba(color, alpha));
        g.addColorStop(1, rgba(color, 0));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 256, 256);
        spot.texture.needsUpdate = true;
      }

      // ============ D2：持续异常计数 + 可解释优先级打分 ============
      function updateD2(zone, status, crowdLevel, source, confidence) {
        const s = d2State[zone];
        // 连续异常计数：status 非“正常”视为异常报文，恢复正常则清零
        if (status !== '正常') s.anomalyCount += 1;
        else s.anomalyCount = 0;

        // source 保留与置信度规则（任务书 0.2 阈值）：
        // - simulated / rule / review：按 README 声明规则直接使用，置信度采用来源声明值 1.0（非伪造）
        // - model / template 等自动感知：confidence 低于 0.2 阈值或缺失 → 不得直接驱动优先处置，标注需人工复核
        const src = source || 'simulated';
        let conf = (confidence === undefined || confidence === null || confidence === '') ? null : Number(confidence);
        let review = false;
        if (src === 'simulated' || src === 'rule' || src === 'review') {
          conf = 1.0;
        } else if (conf === null || conf < 0.2) {
          review = true;
        }
        s.source = src;
        s.confidence = conf === null ? 0 : conf;
        s.review = review;

        // 风险分数 = 环境基础分 + 人流附加分 + 持续异常加成（需复核时人流分不计入）
        const crowdBonus = review ? 0 :
          (CROWD_BONUS_SCORE[Number(crowdLevel)] !== undefined ? CROWD_BONUS_SCORE[Number(crowdLevel)] : 0);
        let score = (ENV_BASE_SCORE[status] !== undefined ? ENV_BASE_SCORE[status] : 0) + crowdBonus;
        if (s.anomalyCount >= PERSIST_THRESHOLD) score += PERSIST_BONUS;
        s.score = score;
      }

      // 选出当前优先关注区域：总分高者优先；同分比连续异常次数；再同分按状态严重度
      function calcPriority() {
        const abnormal = ZONE_IDS.map(function (z) {
          const d = zoneState[z];
          return {
            zone: z,
            status: d ? d.status : '—',
            crowdLevel: d ? d.crowdLevel : null,
            anomalyCount: d2State[z].anomalyCount,
            score: d2State[z].score,
            review: d2State[z].review,
            abnormal: !!(d && d.status !== '正常' && d4Online[z]), // 离线节点不参与 D2 优先级
          };
        }).filter(function (e) { return e.abnormal; });
        if (abnormal.length === 0) return null; // 全部正常 → 无优先关注区域
        abnormal.sort(function (a, b) {
          if (b.score !== a.score) return b.score - a.score;
          if (b.anomalyCount !== a.anomalyCount) return b.anomalyCount - a.anomalyCount;
          return (STATUS_SEVERITY[b.status] || 0) - (STATUS_SEVERITY[a.status] || 0);
        });
        return abnormal[0];
      }

      // 判定理由：依据实际打分过程自动生成，可解释
      function buildPriorityReason(winner) {
        const reasons = [];
        reasons.push('综合风险得分最高（' + winner.score + ' 分），更值得优先处理');
        if (winner.review) reasons.push('人流数据置信度低于阈值，需人工复核');
        if (winner.status === '重度污染') reasons.push('环境状态严重度更高');
        if (Number(winner.crowdLevel) >= 2) reasons.push('人流密度等级更高（' + crowdText(winner.crowdLevel) + '）');
        if (winner.anomalyCount >= PERSIST_THRESHOLD) reasons.push('环境异常持续更久（已连续 ' + winner.anomalyCount + ' 次异常）');
        return reasons.join('；');
      }

      // 左侧面板 D2 模块：当前优先关注区域 + 判定理由
      function renderD2Panel() {
        const winner = calcPriority();
        if (!winner) {
          $d2Priority.innerHTML = '<span class="d2-none">所有区域状态正常，无优先关注区域</span>';
          $d2Reason.textContent = '';
          return;
        }
        $d2Priority.innerHTML = '当前优先关注：<span class="d2-win">' +
          ZONES[winner.zone].name + '（' + winner.zone + '）</span>' +
          (winner.review ? '<span class="d2-win">（人流数据需人工复核）</span>' : '');
        $d2Reason.textContent = '判定理由：' + buildPriorityReason(winner);
      }

      // 3D 闪烁标记：让优先关注区域的高亮壳可见（其余隐藏）
      function updateD2Markers() {
        const winner = calcPriority();
        priorityZone = winner ? winner.zone : null;
      }

      // ============ D3：事件创建 / 状态转移 / 渲染 ============
      function d3CreateEvent(zone, payload, status) {
        const ev = {
          event_id: 'EVT-' + zone + '-' + Date.now(),
          zoneId: zone,
          startTime: payload.time || new Date().toLocaleString('zh-CN', { hour12: false }),
          anomalyDesc: status + (Number(payload.crowdLevel) >= 2 ? ' · 人流' + crowdText(payload.crowdLevel) : ''),
          crowdAnomaly: Number(payload.crowdLevel) >= 2,
          priorityReason: '',
          userAction: null,
          verifyDataList: [],
          normalStreak: 0,
          currentState: D3_STATE.OPEN,
          recoverTime: null,
          finalResult: null,
          historyNotes: [],
          reviewFlag: !!d2State[zone].review,
          severity: STATUS_SEVERITY[status] !== undefined ? STATUS_SEVERITY[status] : 0, // 内部字段：当前异常严重度
        };
        const winner = calcPriority();
        if (winner && winner.zone === zone) ev.priorityReason = buildPriorityReason(winner);
        d3Events[zone] = ev;
      }

      // 每条新报文驱动的 D3 状态转移（数据触发；按钮只能 OPEN→HANDLING）
      function d3HandleMessage(zone, payload, status) {
        try {
          const ev = d3Events[zone];
          const crowd = Number(payload.crowdLevel);
          if (status !== '正常') {
            if (ev) {
              // 同一区域同时只存在 1 个活跃事件：短时间异常合并到同一事件
              const sevNew = STATUS_SEVERITY[status] !== undefined ? STATUS_SEVERITY[status] : 0;
              if (ev.currentState === D3_STATE.HANDLING && sevNew > ev.severity) {
                // HANDLING → OPEN：新数据显示异常恶化，干预无效，允许回退
                ev.currentState = D3_STATE.OPEN;
                ev.normalStreak = 0;
                ev.verifyDataList = [];
                ev.severity = sevNew;
                ev.historyNotes.push('[' + fmt(payload.time) + '] 异常恶化（' + status + '），干预无效，回退 OPEN');
              } else if (ev.currentState === D3_STATE.HANDLING) {
                // 异常改善但仍未恢复正常：保持 HANDLING，数据存入验证列表
                ev.verifyDataList.push({ time: payload.time, pm25: payload.pm25, co2: payload.co2, crowdLevel: crowd });
                if (ev.verifyDataList.length > 10) ev.verifyDataList.shift();
                ev.normalStreak = 0; // 非正常报文，连续正常计数中断
              }
              if (crowd >= 2) ev.crowdAnomaly = true;
              ev.anomalyDesc = status + (crowd >= 2 ? ' · 人流' + crowdText(payload.crowdLevel) : '');
              ev.reviewFlag = ev.reviewFlag || !!d2State[zone].review;
            } else {
              d3CreateEvent(zone, payload, status);
            }
          } else if (ev && ev.currentState === D3_STATE.HANDLING) {
            // HANDLING 收集验证数据；OPEN 收到正常数据保持 OPEN（禁止直接 RECOVERED）
            ev.normalStreak += 1;
            ev.verifyDataList.push({ time: payload.time, pm25: payload.pm25, co2: payload.co2, crowdLevel: crowd });
            if (ev.verifyDataList.length > 10) ev.verifyDataList.shift();
            const crowdOK = !ev.crowdAnomaly || crowd <= 1;
            if (d2State[zone].review) {
              // 置信度 < 0.2：标注需人工复核，事件保持 HANDLING，不触发恢复
              ev.reviewFlag = true;
            } else if (ev.normalStreak >= D3_RECOVER_STREAK && crowdOK) {
              // HANDLING → RECOVERED：连续 2 次正常（人流事件还需 crowdLevel ≤ 1）
              ev.currentState = D3_STATE.RECOVERED;
              ev.recoverTime = payload.time || new Date().toLocaleString('zh-CN', { hour12: false });
              ev.finalResult = '干预「' + ev.userAction + '」有效：连续 ' + ev.normalStreak +
                ' 次正常报文' + (ev.crowdAnomaly ? ' 且人流等级 ≤1' : '') + '，事件恢复';
              d3History.push(ev);
              d3Events[zone] = null;
              startOutlineRecover(zone); // E1：外框平滑渐变回正常颜色
            }
          }
        } catch (e) {
          console.error('[AirGuard] D3 处理异常:', e);
        }
      }

      // 迟到/重复报文：不回滚任何状态，仅补充事件历史记录
      function d3AppendLateNote(zone, payload, label) {
        const hist = d3History.filter(function (e) { return e.zoneId === zone; });
        const target = d3Events[zone] || (hist.length ? hist[hist.length - 1] : null);
        if (target) target.historyNotes.push(label + ' time=' + fmt(payload.time));
      }

      // OPEN → HANDLING：仅允许该转移（其余状态无效，状态保持）；本页无干预按钮，由指令驱动
      function d3ApplyAction(zone, action) {
        const ev = d3Events[zone];
        if (!ev || ev.currentState !== D3_STATE.OPEN) return;
        ev.currentState = D3_STATE.HANDLING;
        ev.userAction = action;
        ev.normalStreak = 0;
        ev.verifyDataList = [];
        renderD3Panel();
        renderD2Panel();
      }

      // 收到干预指令（总视图点击干预后经 MQTT 广播）：同步执行 OPEN → HANDLING
      function onActionMessage(topic, payload) {
        const zone = (payload && payload.zoneId) || topic.split('/')[1] || '';
        if (!Object.prototype.hasOwnProperty.call(ZONES, zone)) return;
        d3ApplyAction(zone, payload.action || '—');
      }

      // 左侧面板 D3 事件状态 + 3D 标记壳状态（OPEN 白框 / HANDLING 橙闪 / 其余隐藏）
      function renderD3Panel() {
        const $d3Panel = document.getElementById('d3-panel');
        $d3Panel.innerHTML = ZONE_IDS.map(function (z) {
          const ev = d3Events[z];
          if (!d4Online[z]) {
            // 离线节点不参与 D3 事件状态计算，事件冻结，标记壳隐藏
            d3ShellState[z] = null;
            return '<div class="d3-line off">' + ZONES[z].name + '：已离线（事件状态冻结）</div>';
          }
          if (!ev) {
            d3ShellState[z] = null;
            const hist = d3History.filter(function (e) { return e.zoneId === z; });
            const last = hist.length ? hist[hist.length - 1] : null;
            if (last) {
              return '<div class="d3-line ok">' + ZONES[z].name + '：已恢复（' + (last.userAction || '—') + '）</div>';
            }
            return '<div class="d3-line">' + ZONES[z].name + '：无事件</div>';
          }
          if (ev.currentState === D3_STATE.OPEN) {
            d3ShellState[z] = D3_STATE.OPEN;
            return '<div class="d3-line open">' + ZONES[z].name + '：OPEN 待处理（等待干预）</div>';
          }
          d3ShellState[z] = D3_STATE.HANDLING;
          return '<div class="d3-line handling">' + ZONES[z].name + '：HANDLING 处理中 · 连续正常 ' +
            ev.normalStreak + '/' + D3_RECOVER_STREAK +
            (ev.reviewFlag ? ' · 需人工复核' : '') + '</div>';
        }).join('');
      }

      // 悬浮信息面板内容（E1：实时 PM2.5 / CO₂ / 人流密度 / D5 判定结论 + 原有 D3 事件详情）
      function buildInfoHtml(zone) {
        const d = zoneState[zone];
        const s = d5State[zone];
        const ev = d3Events[zone];
        const hist = d3History.filter(function (e) { return e.zoneId === zone; });
        const last = hist.length ? hist[hist.length - 1] : null;
        const d5Line = (!s || s.pm25Hist.length === 0)
          ? '数据积累中（0/' + D5_MIN_SAMPLES + '）'
          : ('规则' + (s.rule === '环境异常' ? '异常' : '正常') + ' ｜ ML ' + s.ml +
             (s.pmThr !== null ? '（阈值 pm25 ' + s.pmThr + ' / co2 ' + s.co2Thr + '）' : '') +
             (s.mismatch ? ' ｜ ⚠不一致·建议人工复核' : ' ｜ 一致'));
        let d3Line;
        if (ev) {
          d3Line = (ev.currentState === D3_STATE.OPEN ? 'OPEN 待处理' : 'HANDLING 处理中') +
            ' · ' + ev.event_id +
            (ev.currentState === D3_STATE.HANDLING
              ? ' · 处置：' + (ev.userAction || '—') + ' · 连续正常 ' + ev.normalStreak + '/' + D3_RECOVER_STREAK
              : ' · 等待人工干预（干预按钮在总视图 D3 面板）');
        } else if (last) {
          d3Line = 'RECOVERED 已恢复 · ' + (last.finalResult || '');
        } else {
          d3Line = '无事件';
        }
        return '<b class="zname">' + ZONES[zone].name + '（' + zone + '）</b>' +
          '<div class="info-row">实时 PM2.5：<b>' + (d ? fmt(d.pm25) : '--') + ' μg/m³</b>' +
          ' ｜ CO₂：<b>' + (d ? fmt(d.co2) : '--') + ' ppm</b></div>' +
          '<div class="info-row">人流密度：<b>' + (d ? crowdText(d.crowdLevel) + '（L' + d.crowdLevel + '）' : '--') + '</b>' +
          ' ｜ 状态：<b>' + (d ? d.status : '暂无数据') + '</b></div>' +
          '<div class="info-row">D5 判定：' + d5Line + '</div>' +
          '<div class="info-row">D3 事件：' + d3Line + '</div>' +
          '<button id="btn-focus-reset" class="focus-reset" type="button">回到全景视角</button>';
      }

      // 点击建筑：弹出悬浮信息面板（8 秒后自动关闭，面板打开期间随报文实时刷新）
      function d3ShowEventInfo(zone) {
        infoZone = zone;
        const $d3Info = document.getElementById('d3-info');
        $d3Info.innerHTML = buildInfoHtml(zone);
        $d3Info.style.display = 'block';
        clearTimeout(d3InfoTimer);
        d3InfoTimer = setTimeout(function () {
          $d3Info.style.display = 'none';
          infoZone = null;
        }, 8000);
      }

      // 面板打开期间随 MQTT 新报文实时刷新内容（页面不刷新）
      function refreshInfoPanel() {
        if (!infoZone) return;
        const $d3Info = document.getElementById('d3-info');
        if ($d3Info.style.display !== 'none') $d3Info.innerHTML = buildInfoHtml(infoZone);
      }

      // ============ D4：链路状态面板 / 定时在线判定 / 手动重连 ============
      function renderD4Panel() {
        const $el = $d4Panel;
        const brokerLine = '<div class="d4-line ' + (mqttConnState === 'on' ? 'on' : 'off') + '">' +
          'MQTT：' + (mqttConnState === 'on' ? '已连接' : (mqttConnState === 'off' ? '已断开' : '连接中…')) + '</div>';
        const zoneLines = ZONE_IDS.map(function (z) {
          const online = !!d4Online[z];
          const seen = d4LastSeen[z]
            ? d4LastSeen[z].toLocaleTimeString('zh-CN', { hour12: false })
            : '—';
          return '<div class="d4-line ' + (online ? 'on' : 'off') + '">' +
            ZONES[z].name + '（' + z + '）：' + (online ? '在线' : '离线') +
            ' · lastSeen ' + seen + '</div>';
        }).join('');
        $el.innerHTML = brokerLine + zoneLines;
      }

      // 每秒巡检：超过阈值无新数据 → 节点离线（灰显 + 日志）
      function d4Tick() {
        const now = Date.now();
        let changed = false;
        ZONE_IDS.forEach(function (z) {
          const online = !!d4LastSeen[z] && (now - d4LastSeen[z].getTime()) <= D4_OFFLINE_THRESHOLD;
          if (online !== d4Online[z]) {
            d4Online[z] = online;
            changed = true;
            console.log('[AirGuard] D4 故障日志: [' + (online ? '链路恢复' : '节点断流') + '] ' +
              ZONES[z].name + (online ? ' 节点恢复上报数据' : ' 超过 ' + (D4_OFFLINE_THRESHOLD / 60000) + ' 分钟未上报数据，节点离线'));
          }
        });
        if (changed) {
          updateScene();      // 离线模型灰显 / 恢复后重新着色
          renderD3Panel();    // 离线事件冻结
          renderD2Panel();    // 离线节点退出优先关注
        }
        renderD4Panel();
        refreshInfoPanel();   // 离线状态变化同步到悬浮面板
      }

      // 手动重连：断开当前连接后由 mqtt.js 自动重建
      function d4ManualReconnect() {
        console.log('[AirGuard] D4 故障日志: [人工重连] 用户点击手动重连按钮');
        try { client.end(true); } catch (e) { /* 忽略断开异常 */ }
        setTimeout(function () { client.reconnect(); }, 300);
      }

      // ============ D5：两套判断 / 脏数据前置检查 / 面板与3D提醒 ============
      function d5MeanStd(arr) {
        const n = arr.length;
        let sum = 0, i;
        for (i = 0; i < n; i++) sum += arr[i];
        const mean = sum / n;
        let sq = 0;
        for (i = 0; i < n; i++) sq += (arr[i] - mean) * (arr[i] - mean);
        return { mean: mean, std: Math.sqrt(sq / (n - 1)) }; // 样本标准差
      }

      function d5Rejudge(s) {
        if (s.pm25Hist.length < D5_MIN_SAMPLES) {
          s.ml = '数据积累中';
          s.mismatch = false;
          s.pmThr = null;
          s.co2Thr = null;
          return;
        }
        const mp = d5MeanStd(s.pm25Hist.slice(0, -1)); // 统计用历史（不含当前值）
        const mc = d5MeanStd(s.co2Hist.slice(0, -1));
        s.pmThr = Math.round((mp.mean + d5Mult * mp.std) * 10) / 10;
        s.co2Thr = Math.round((mc.mean + d5Mult * mc.std) * 10) / 10;
        s.ml = (s.pm25 > s.pmThr || s.co2 > s.co2Thr) ? '与历史明显不同' : '符合历史常态';
        s.mismatch = (s.rule === '环境异常') !== (s.ml === '与历史明显不同');
      }

      // 每条有效报文驱动的 D5 处理（脏数据在写入历史前拦截）
      function d5HandleMessage(zone, payload) {
        try {
          const s = d5State[zone];
          const t = payload.time;
          // ---- 数据质量前置检查 ----
          if (payload.pm25 === undefined || payload.pm25 === null || payload.pm25 === '' ||
              payload.co2 === undefined || payload.co2 === null || payload.co2 === '') {
            console.warn('[AirGuard][D5] 脏数据:', zone, 'pm25/co2 为空或缺失，报文丢弃');
            return;
          }
          const p = Number(payload.pm25);
          const c = Number(payload.co2);
          if (isNaN(p) || isNaN(c)) {
            console.warn('[AirGuard][D5] 脏数据:', zone, 'pm25/co2 非数值，报文丢弃');
            return;
          }
          if (p > 900) {
            console.warn('[AirGuard][D5] 脏数据:', zone, 'pm25=' + p + ' 超出量程（>900），离群脏数据不参与计算');
            return;
          }
          if (!t) {
            console.warn('[AirGuard][D5] 脏数据:', zone, 'time 字段缺失，不更新历史数据');
            return;
          }
          if (s.lastTime && t < s.lastTime) {
            console.warn('[AirGuard][D5] 脏数据:', zone, '时间倒流（' + t + ' < ' + s.lastTime + '），不更新历史数据');
            return;
          }
          s.lastTime = t;

          // ---- 追加历史（长度受控，防内存溢出） ----
          s.pm25Hist.push(p);
          s.co2Hist.push(c);
          if (s.pm25Hist.length > D5_HISTORY_MAX) s.pm25Hist.shift();
          if (s.co2Hist.length > D5_HISTORY_MAX) s.co2Hist.shift();
          s.pm25 = p;
          s.co2 = c;

          // ---- 两套判断 + 日志 ----
          s.rule = (p > 75 || c > 1000) ? '环境异常' : '正常';
          d5Rejudge(s);
          console.log('[AirGuard][D5]', zone,
            'pm25=' + p, 'co2=' + c,
            '规则=' + s.rule, 'ML=' + s.ml,
            s.pmThr !== null ? '阈值 pm25=' + s.pmThr + '/co2=' + s.co2Thr : '',
            '一致=' + (s.mismatch ? '否(建议人工复核)' : '是'));
          renderD5Panel();
          updateScene(); // 刷新标签「ML不一致」文字标注与黄色闪烁壳
        } catch (e) {
          console.error('[AirGuard] D5 处理异常:', e);
        }
      }

      // 左侧面板 D5 简要信息 + 黄色闪烁壳状态
      function renderD5Panel() {
        const $d5Panel = document.getElementById('d5-panel');
        $d5Panel.innerHTML = ZONE_IDS.map(function (z) {
          const s = d5State[z];
          d5ShellState[z] = !!s.mismatch;
          const mlText = s.ml === '数据积累中'
            ? '数据积累中(' + s.pm25Hist.length + '/' + D5_MIN_SAMPLES + ')'
            : (s.ml === '与历史明显不同' ? 'ML异常' : 'ML常态');
          const line = ZONES[z].name + '：规则' + (s.rule === '环境异常' ? '异常' : (s.rule === '—' ? '—' : '正常')) +
            ' · ' + mlText + ' · ' + (s.mismatch ? '⚠不一致' : '一致');
          return '<div class="d5-line' + (s.mismatch ? ' conflict' : '') + '">' + line + '</div>';
        }).join('');
      }

      // ============ 钟盘纹理（教学区钟楼） ============
      function makeClockTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        const clock = { canvas: canvas, texture: texture };
        drawClock(clock);
        return clock;
      }

      function drawClock(clock) {
        const ctx = clock.canvas.getContext('2d');
        const s = clock.canvas.width;
        const c = s / 2;
        const r = c - 8;
        ctx.clearRect(0, 0, s, s);
        // 白色钟面 + 深色圆框
        ctx.fillStyle = '#fafafa';
        ctx.beginPath();
        ctx.arc(c, c, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#37474f';
        ctx.beginPath();
        ctx.arc(c, c, r - 3, 0, Math.PI * 2);
        ctx.stroke();
        // 12 个整点刻度
        ctx.lineWidth = 4;
        for (let i = 0; i < 12; i++) {
          const a = i / 12 * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(c + Math.cos(a) * (r - 16), c + Math.sin(a) * (r - 16));
          ctx.lineTo(c + Math.cos(a) * (r - 6), c + Math.sin(a) * (r - 6));
          ctx.stroke();
        }
        // 指针按当前时间
        const now = new Date();
        const h = (now.getHours() % 12 + now.getMinutes() / 60) / 12 * Math.PI * 2 - Math.PI / 2;
        const m = now.getMinutes() / 60 * Math.PI * 2 - Math.PI / 2;
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(c, c);
        ctx.lineTo(c + Math.cos(h) * (r - 52), c + Math.sin(h) * (r - 52));
        ctx.stroke();
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(c, c);
        ctx.lineTo(c + Math.cos(m) * (r - 28), c + Math.sin(m) * (r - 28));
        ctx.stroke();
        // 轴心
        ctx.fillStyle = '#37474f';
        ctx.beginPath();
        ctx.arc(c, c, 6, 0, Math.PI * 2);
        ctx.fill();
        clock.texture.needsUpdate = true;
      }

      // ============ 建筑构件辅助 ============
      const NEUTRAL_ROOF = 0xb0bec5; // 屋顶 / 装饰件固定中性色
      const NEUTRAL_BASE = 0xcfd8dc; // 底座固定中性色

      function lambert(color, wall) {
        return wall ? new THREE.MeshLambertMaterial({ map: wall.texture }) : new THREE.MeshLambertMaterial({ color: color });
      }

      function mesh(geometry, material, x, y, z) {
        const m = new THREE.Mesh(geometry, material);
        m.position.set(x, y, z);
        m.castShadow = true;
        m.receiveShadow = true;
        return m;
      }

      function addBase(group, w, d) {
        group.add(mesh(new THREE.BoxGeometry(w, 0.15, d), lambert(NEUTRAL_BASE), 0, 0.075, 0));
      }

      // 宿舍区：三栋高低错落的公寓楼，平屋顶
      function buildDormitory() {
        const group = new THREE.Group();
        const walls = [];
        const specs = [
          { z: -3.2, h: 3.6 },
          { z: 0, h: 4.8 },
          { z: 3.2, h: 3.6 },
        ];
        specs.forEach(function (spec) {
          const wall = makeWall(4, 3);
          walls.push(wall);
          group.add(mesh(new THREE.BoxGeometry(4.4, spec.h, 2.8), lambert(null, wall), 0, spec.h / 2, spec.z));
          group.add(mesh(new THREE.BoxGeometry(4.8, 0.2, 3.2), lambert(NEUTRAL_ROOF), 0, spec.h + 0.1, spec.z));
        });
        addBase(group, 6.2, 9.6);
        return { group: group, walls: walls };
      }

      // 教学区：裙楼 + 钟楼主楼（塔顶前后两面钟盘 + 四棱锥尖顶）
      function buildTeaching() {
        const group = new THREE.Group();
        const walls = [];

        const podiumWall = makeWall(2, 6);
        walls.push(podiumWall);
        group.add(mesh(new THREE.BoxGeometry(10, 2.8, 6), lambert(null, podiumWall), 0, 1.4, 0));

        const towerWall = makeWall(5, 3);
        walls.push(towerWall);
        group.add(mesh(new THREE.BoxGeometry(4.2, 5.6, 4.2), lambert(null, towerWall), 0, 2.8 + 2.8, 0));

        // 钟楼冠层：+z/−z 两面为白底钟盘（固定不变色），其余面随状态换色
        clockFace = makeClockTexture();
        const crownWall = makeWall(1, 3);
        walls.push(crownWall);
        const crownMats = [
          lambert(null, crownWall), lambert(null, crownWall),      // ±x
          lambert(NEUTRAL_ROOF), lambert(NEUTRAL_ROOF),            // ±y
          new THREE.MeshLambertMaterial({ map: clockFace.texture }), // +z 钟盘
          new THREE.MeshLambertMaterial({ map: clockFace.texture }), // −z 钟盘
        ];
        group.add(mesh(new THREE.BoxGeometry(4.6, 2.2, 4.6), crownMats, 0, 9.5, 0));

        // 四棱锥尖顶 + 顶珠
        const spire = mesh(new THREE.ConeGeometry(3.3, 2.2, 4), lambert(NEUTRAL_ROOF), 0, 11.7, 0);
        spire.rotation.y = Math.PI / 4;
        group.add(spire);
        group.add(mesh(new THREE.SphereGeometry(0.2, 12, 12), lambert(NEUTRAL_ROOF), 0, 12.95, 0));

        addBase(group, 11, 7);
        return { group: group, walls: walls };
      }

      // 食堂区：单层大跨度食堂 + 人字坡屋顶 + 烟囱
      function buildCanteen() {
        const group = new THREE.Group();
        const walls = [];

        const hallWall = makeWall(2, 5);
        walls.push(hallWall);
        group.add(mesh(new THREE.BoxGeometry(10, 3.2, 6), lambert(null, hallWall), 0, 1.6, 0));

        // 人字坡屋顶：三角形截面沿长度挤出（两端出檐）
        const shape = new THREE.Shape();
        shape.moveTo(-3.4, 0);
        shape.lineTo(3.4, 0);
        shape.lineTo(0, 2.4);
        shape.closePath();
        const roofGeo = new THREE.ExtrudeGeometry(shape, { depth: 10, bevelEnabled: false });
        roofGeo.translate(0, 0, -5); // 挤出方向沿 z，平移使长度居中
        const roof = mesh(roofGeo, lambert(NEUTRAL_ROOF), 0, 3.2, 0);
        roof.rotation.y = Math.PI / 2; // 屋脊方向转至 x
        group.add(roof);

        // 烟囱（从坡面穿出）
        group.add(mesh(new THREE.CylinderGeometry(0.35, 0.45, 1.5, 12), lambert(0x90a4ae), 2.5, 5.7, -0.8));

        // 食堂窗口：正立面一排售卖窗口 + 遮阳棚（空间对象对应：食堂窗口）
        const winGeom = new THREE.BoxGeometry(0.9, 0.75, 0.12);
        [-3.4, -1.13, 1.13, 3.4].forEach(function (x) {
          group.add(mesh(winGeom, lambert(0xffcc80), x, 1.15, 3.06));
        });
        group.add(mesh(new THREE.BoxGeometry(9.6, 0.08, 0.9), lambert(0xff8a65), 0, 1.85, 3.35));

        addBase(group, 11, 7);
        return { group: group, walls: walls };
      }

      function animate() {
        requestAnimationFrame(animate);
        const now = performance.now();
        // D2 优先关注建筑高亮壳：轻微闪烁（透明度正弦波动）
        ZONE_IDS.forEach(function (z) {
          const shell = highlightShells[z];
          if (!shell) return;
          if (priorityZone === z) {
            shell.material.opacity = 0.10 + 0.14 * (0.5 + 0.5 * Math.sin(performance.now() * 0.004));
          } else {
            shell.material.opacity = 0;
          }
        });
        // D3 状态标记壳：OPEN 白框静止 / HANDLING 橙色闪烁 / RECOVERED 恢复原色（隐藏）
        ZONE_IDS.forEach(function (z) {
          const shell = d3Shells[z];
          if (!shell) return;
          const st = d3ShellState[z];
          if (st === D3_STATE.OPEN) {
            shell.material.color.set(0xffffff);
            shell.material.opacity = 0.55;
          } else if (st === D3_STATE.HANDLING) {
            shell.material.color.set(0xff9800);
            shell.material.opacity = 0.35 + 0.3 * (0.5 + 0.5 * Math.sin(performance.now() * 0.005));
          } else {
            shell.material.opacity = 0;
          }
        });
        // D5 规则/ML 不一致提醒壳：黄色闪烁，一致时隐藏
        ZONE_IDS.forEach(function (z) {
          const shell = d5Shells[z];
          if (!shell) return;
          if (d5ShellState[z]) {
            shell.material.opacity = 0.3 + 0.3 * (0.5 + 0.5 * Math.sin(performance.now() * 0.006));
          } else {
            shell.material.opacity = 0;
          }
        });
        // E1 建筑外框：HANDLING 黄色闪烁；恢复中平滑渐变回目标色；其余显示目标色
        ZONE_IDS.forEach(function (z) {
          const o = outlines[z];
          if (!o) return;
          if (d3ShellState[z] === D3_STATE.HANDLING) {
            o.recover = null;
            const k = 0.5 + 0.5 * Math.sin(now * 0.008);
            o.color.copy(OUTLINE_HANDLING_COL).lerp(OUTLINE_HANDLING_LIGHT, k);
            o.mesh.material.opacity = 0.55 + 0.45 * k;
          } else if (o.recover) {
            const p = Math.min(1, (now - o.recover.start) / OUTLINE_RECOVER_MS);
            const e = p * p * (3 - 2 * p); // smoothstep 缓动
            o.color.lerpColors(o.recover.from, o.targetColor, e);
            o.mesh.material.opacity = 0.85;
            if (p >= 1) o.recover = null;
          } else {
            o.color.copy(o.targetColor);
            o.mesh.material.opacity = 0.85;
          }
          o.mesh.material.color.copy(o.color);
        });
        // E1 人流密度光圈：尺寸平滑跟随等级，闪烁速度随等级加快；无数据淡出
        ZONE_IDS.forEach(function (z) {
          const r = crowdRings[z];
          if (!r) return;
          if (r.level === null) {
            r.mesh.material.opacity = Math.max(0, r.mesh.material.opacity - 0.06);
            return;
          }
          r.cur += (r.target - r.cur) * 0.12;
          r.mesh.scale.setScalar(r.cur);
          const freq = 1.2 + r.level * 2.2; // rad/s：crowdLevel 越大闪烁越快
          r.mesh.material.opacity = 0.35 + 0.3 * (0.5 + 0.5 * Math.sin(now * 0.001 * freq));
        });
        // E1 D2 优先关注：发光光晕脉冲（叠加在原有高亮壳之上）
        ZONE_IDS.forEach(function (z) {
          const g = glowSprites[z];
          if (!g) return;
          if (priorityZone === z && d4Online[z]) {
            g.visible = true;
            const k = 0.5 + 0.5 * Math.sin(now * 0.005);
            g.material.opacity = 0.35 + 0.3 * k;
            g.scale.set(13 + 3 * k, 13 + 3 * k, 1);
          } else {
            g.visible = false;
            g.material.opacity = 0;
          }
        });
        // E1 相机聚焦插值：点击建筑后平滑移动镜头
        if (focusT < 1) {
          focusT = Math.min(1, focusT + (now - lastFrame) / 900);
          const e = focusT * focusT * (3 - 2 * focusT);
          TARGET.lerpVectors(focusFrom, focusTo, e);
          radius = focusFromRadius + (focusToRadius - focusFromRadius) * e;
          lastFrame = now;
        }
        camera.position.set(
          TARGET.x + radius * Math.sin(phi) * Math.sin(theta),
          TARGET.y + radius * Math.cos(phi),
          TARGET.z + radius * Math.sin(phi) * Math.cos(theta)
        );
        camera.lookAt(TARGET);
        renderer.render(scene, camera);
      }

      // ============ 左侧数据面板 ============
      function renderPanel() {
        $zonePanel.innerHTML = ZONE_IDS.map(function (zone) {
          const d = zoneState[zone];
          if (!d) {
            return '<div class="zone-item">' +
              '<div class="zi-head"><b>' + ZONES[zone].name + '</b>' +
              '<span class="zone-id">' + zone + '</span>' +
              '<span class="zi-badge">暂无数据</span></div>' +
              '<p class="zi-empty">暂无实时数据</p>' +
              '</div>';
          }
          const bg = STATUS_BG[d.status] || WAIT_BG;
          const accent = STATUS_ACCENT[d.status] || WAIT_ACCENT;
          return '<div class="zone-item" style="background:' + bg + ';border-left-color:' + accent + '">' +
            '<div class="zi-head"><b>' + ZONES[zone].name + '</b>' +
            '<span class="zone-id">' + zone + '</span>' +
            '<span class="zi-badge" style="background:' + accent + '">' + d.status + '</span></div>' +
            '<ul class="zi-metrics">' +
            '<li>PM2.5<b>' + fmt(d.pm25) + '</b>μg/m³</li>' +
            '<li>CO₂<b>' + fmt(d.co2) + '</b>ppm</li>' +
            '<li>人流<b>' + crowdText(d.crowdLevel) + '</b></li>' +
            '<li>上报时间<b>' + fmt(d.time) + '</b></li>' +
            '<li class="full">空间对象<b>' + (ZONE_OBJECTS[zone] || '—') + '</b></li>' +
            '<li class="full">处置<b>' + (DISPOSALS[d.status] || '—') + '</b></li>' +
            '</ul>' +
            '</div>';
        }).join('');
      }

      // 消息去重键：优先 message id（payload.msgId）；
      // 无 msgId 时使用 zoneId + time + 关键荷载（event_id 仅标识事件，不参与去重）
      function msgDedupKey(zone, payload) {
        if (payload.msgId !== undefined && payload.msgId !== null && payload.msgId !== '') {
          return zone + '|msgId:' + payload.msgId;
        }
        return zone + '|' + payload.time + '|' + [payload.pm25, payload.co2, payload.crowdLevel].join(',');
      }

      // D4：环境报文合法性校验（pm25 / co2 / crowdLevel 必须为数值）
      function isValidEnvPayload(p) {
        return p && typeof p === 'object' && !Array.isArray(p) &&
          p.pm25 !== undefined && p.pm25 !== null && p.pm25 !== '' && !isNaN(Number(p.pm25)) &&
          p.co2 !== undefined && p.co2 !== null && p.co2 !== '' && !isNaN(Number(p.co2)) &&
          p.crowdLevel !== undefined && p.crowdLevel !== null && p.crowdLevel !== '' && !isNaN(Number(p.crowdLevel));
      }

      // ============ 消息处理 ============
      function onEnvMessage(topic, payload) {
        const zone = resolveZone(topic, payload);
        if (!zone) {
          console.warn('[AirGuard] 未知区域消息，已忽略:', topic);
          return;
        }
        // ===== 消息健壮性 =====
        // 重复：同一消息只生效一次（msgId 优先，否则 zoneId+time+关键荷载）
        // 乱序：time 不递增的旧消息不得覆盖新状态；迟到：不回滚 RECOVERED，仅补充历史记录
        const msgTime = payload.time;
        const lastTime = zoneLastMsgTime[zone];
        const dedupKey = msgDedupKey(zone, payload);
        if (msgTime && lastTime) {
          if (dedupKey === zoneLastMsgKey[zone]) {
            console.log('[AirGuard] 重复消息已忽略:', zone, msgTime);
            d3AppendLateNote(zone, payload, '重复报文');
            return;
          }
          if (msgTime < lastTime) {
            console.log('[AirGuard] 迟到消息，仅补充历史记录:', zone, msgTime);
            d3AppendLateNote(zone, payload, '迟到报文');
            return;
          }
        }
        zoneLastMsgKey[zone] = dedupKey;
        zoneLastMsgTime[zone] = msgTime || lastTime;

        // D4：非法报文过滤（字段缺失 / 非数值），丢弃且不崩溃
        if (!isValidEnvPayload(payload)) {
          console.error('[AirGuard] 报文格式错误:', payload);
          return;
        }
        d4LastSeen[zone] = new Date(); // 更新节点 lastSeen
        // 收到有效报文即视为在线（无需等 1 秒巡检）：D2 优先关注高亮/发光在首条异常报文当刻生效
        if (!d4Online[zone]) {
          console.log('[AirGuard] D4 故障日志: [链路恢复] ' + ZONES[zone].name + ' 节点恢复上报数据');
        }
        d4Online[zone] = true;

        const status = calcStatus(payload.pm25, payload.co2);
        // 只更新对应 zone，绝不写入其他区域
        zoneState[zone] = {
          zoneId: zone,
          pm25: payload.pm25,
          co2: payload.co2,
          crowdLevel: payload.crowdLevel,
          // crowdLevel 保留 source / confidence（报文可选字段，缺失按 README 声明默认处理）
          crowdSource: payload.crowdSource || 'simulated',
          crowdConfidence: (payload.crowdConfidence === undefined || payload.crowdConfidence === null || payload.crowdConfidence === '')
            ? null : Number(payload.crowdConfidence),
          time: payload.time,
          status: status,
          receivedAt: new Date(),
        };
        // D2：更新连续异常计数与风险总分，刷新面板与 3D 闪烁标记
        updateD2(zone, status, payload.crowdLevel, payload.crowdSource, payload.crowdConfidence);
        // D3：驱动状态机（数据触发；OPEN→HANDLING 仅由按钮人工触发）
        d3HandleMessage(zone, payload, status);
        // D5：两套判断（固定规则 + 轻量ML），脏数据前置拦截
        d5HandleMessage(zone, payload);
        renderPanel();
        renderD2Panel();
        renderD3Panel();
        updateD2Markers();
        updateScene();
        refreshInfoPanel(); // 悬浮面板打开期间随报文实时刷新
      }

      // ============ MQTT 连接 ============
      const client = mqtt.connect(MQTT_URL, { reconnectPeriod: 5000 });

      client.on('connect', function () {
        setConn('on');
        client.subscribe(TOPIC, function (err) {
          if (err) console.error('[AirGuard] 订阅失败:', err);
        });
        client.subscribe(ACTION_TOPIC, function (err) {
          if (err) console.error('[AirGuard] action 订阅失败:', err);
        });
      });
      client.on('close', function () { setConn('off'); });
      client.on('offline', function () { setConn('off'); });
      client.on('reconnect', function () { setConn(''); });
      client.on('error', function (err) {
        console.error('[AirGuard] MQTT 错误:', err);
        setConn('off', '连接错误，自动重连中…');
      });
      client.on('message', function (topic, message) {
        try {
          const text = new TextDecoder().decode(message);
          // 前置判断：空报文直接跳过，避免 JSON.parse 抛 Unexpected end of JSON input
          if (!text || text.trim() === '') {
            console.warn('[AirGuard] 收到空报文，跳过解析 topic=' + topic);
            return;
          }
          const payload = JSON.parse(text);
          if (!payload || typeof payload !== 'object' || Array.isArray(payload)) {
            throw new Error('payload 不是对象');
          }
          // 按主题分流：/action 干预指令；其余按环境报文处理
          if (topic.indexOf('/action') > -1) {
            e3Ack(client, payload, 'received');  // 回执①：已接收（小程序指令带 msgId 时）
            onActionMessage(topic, payload);
            e3Ack(client, payload, 'executed');  // 回执②：业务执行完成
          } else onEnvMessage(topic, payload);
        } catch (e) {
          // 错误 JSON 不崩溃页面，仅控制台输出
          console.error('[AirGuard] 报文格式错误（JSON 解析失败）:', e);
        }
      });

      // ============ 初始化 ============
      try {
        initScene();
      } catch (e) {
        console.error('[AirGuard] 3D 场景初始化失败:', e);
        document.getElementById('three-fallback').style.display = 'flex';
      }
      // 钟盘指针每 30 秒对时
      setInterval(function () {
        if (clockFace) drawClock(clockFace);
      }, 30000);

      // D4：每秒巡检节点在线状态；手动重连按钮
      setInterval(d4Tick, 1000);
      document.getElementById('btn-reconnect').addEventListener('click', d4ManualReconnect);
      // E1：悬浮面板「回到全景视角」按钮（innerHTML 重建后事件委托仍生效）
      document.getElementById('d3-info').addEventListener('click', function (e) {
        if (e.target && e.target.id === 'btn-focus-reset') resetCameraFocus();
      });

      // ============ E3 Web—小程序 实时同步与协同 ============
      // 新增接入，不修改原有代码：函数包装（calcPriority / buildPriorityReason）
      // + 独立 MQTT 订阅（airguard/e3/#）。小程序切换重点区域时，
      // 3D 页面的 D2 发光高亮 / 面板同步更新；标记事件状态时状态壳同步。
      let e3FocusZone = null; // 小程序人工指定重点区域（null = 按规则计算）

      const __e3CalcPriority = calcPriority;
      calcPriority = function () {
        if (e3FocusZone) {
          const z = e3FocusZone;
          const d = zoneState[z];
          return {
            zone: z,
            status: d ? d.status : '—',
            crowdLevel: d ? d.crowdLevel : null,
            anomalyCount: d2State[z].anomalyCount,
            score: d2State[z].score,
            review: d2State[z].review,
            abnormal: true,      // 人工指定优先于规则计算结果
            e3Assigned: true,
          };
        }
        return __e3CalcPriority();
      };
      const __e3BuildReason = buildPriorityReason;
      buildPriorityReason = function (winner) {
        if (winner && winner.e3Assigned) return '小程序巡检端人工指定重点区域（跨端协同同步）';
        return __e3BuildReason(winner);
      };

      // ---------- 消息确认回执（任务书三级反馈；新增，不影响原有逻辑） ----------
      // 收到小程序指令（带 msgId）→ 立即回执 received；业务执行完成后回执 executed
      function e3NowStr() {
        const d = new Date();
        const p = function (n) { return (n < 10 ? '0' : '') + n; };
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
          p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
      }
      function e3Ack(pubClient, p, ackType) {
        if (!p || !p.msgId) return; // 无 msgId（如 MQTTX 手发旧格式指令）不发回执，兼容原有流程
        try {
          pubClient.publish('airguard/E3/ack', JSON.stringify({
            msgId: p.msgId,
            zoneId: p.zoneId || '',
            ackType: ackType,
            source: 'three3d',
            time: e3NowStr(),
          }));
        } catch (e) {
          console.error('[AirGuard][E3] 回执发布失败:', e);
        }
        console.log('[AirGuard][E3] 回执:', ackType, p.msgId);
      }

      const e3Client = mqtt.connect(MQTT_URL, { reconnectPeriod: 5000 });
      e3Client.on('connect', function () {
        e3Client.subscribe('airguard/e3/focus');
        e3Client.subscribe('airguard/e3/event');
      });
      e3Client.on('message', function (topic, message) {
        try {
          const text = new TextDecoder().decode(message);
          // 前置判断：空报文直接跳过，避免 JSON.parse 抛 Unexpected end of JSON input
          if (!text || text.trim() === '') {
            console.warn('[AirGuard] 收到空报文，跳过解析 topic=' + topic);
            return;
          }
          const p = JSON.parse(text);
          if (!p || typeof p !== 'object' || Array.isArray(p)) return;
          if (topic.indexOf('airguard/e3/focus') === 0) {
            e3Ack(e3Client, p, 'received'); // 回执①：已接收
            const z = p.zoneId;
            e3FocusZone = Object.prototype.hasOwnProperty.call(ZONES, z) ? z : null;
            updateD2Markers(); // 3D 发光高亮随重点区域切换
            renderD2Panel();
            console.log('[AirGuard][E3] 重点区域指令:', z || '（恢复规则判定）');
            e3Ack(e3Client, p, 'executed'); // 回执②：业务执行完成
          } else if (topic.indexOf('airguard/e3/event') === 0) {
            e3Ack(e3Client, p, 'received'); // 回执①：已接收
            const z = p.zoneId;
            if (!Object.prototype.hasOwnProperty.call(ZONES, z)) { e3Ack(e3Client, p, 'executed'); return; }
            if (p.op === 'recovered') {
              const ev = d3Events[z];
              if (ev) {
                ev.currentState = D3_STATE.RECOVERED;
                ev.recoverTime = p.time || new Date().toLocaleString('zh-CN', { hour12: false });
                ev.finalResult = '小程序巡检端标记已恢复' +
                  (p.note ? '（' + p.note + '）' : '') + '：跨端事件同步';
                ev.historyNotes.push('[小程序] ' + (p.time || '') + ' 标记事件已恢复');
                d3History.push(ev);
                d3Events[z] = null;
                startOutlineRecover(z); // 外框从处理中黄色平滑渐变回环境色
              }
              renderD3Panel();
              renderD2Panel();
              console.log('[AirGuard][E3] 事件已恢复指令:', z);
              e3Ack(e3Client, p, 'executed'); // 回执②：业务执行完成
            } else if (p.op === 'handling') {
              d3ApplyAction(z, p.note || '小程序标记处理中');
              renderD3Panel();
              renderD2Panel();
              console.log('[AirGuard][E3] 事件处理中指令:', z);
              e3Ack(e3Client, p, 'executed'); // 回执②：业务执行完成
            }
          }
        } catch (e) {
          console.error('[AirGuard][E3] 指令解析失败:', e);
        }
      });

      renderPanel(); // 初始：三区域均为「暂无实时数据」，建筑墙体灰色
      renderD2Panel(); // 初始：无优先关注区域
      renderD3Panel(); // 初始：三区域均无事件
      renderD4Panel(); // 初始：MQTT 断开 + 三区域离线
      renderD5Panel(); // 初始：D5 数据积累中
    })();
  </script>
</body>
</html>
