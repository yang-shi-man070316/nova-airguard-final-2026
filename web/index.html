<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirGuard 空气质量与人流监测综合系统 · Web 总视图</title>
  <!-- mqtt.js CDN（UMD 构建，暴露全局 mqtt） -->
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #eef1f5;
      --panel-bg: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --nav-bg: #0f172a;
      --wait-bg: #f5f5f5;
      --wait-accent: #9ca3af;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ===== 顶部全局导航栏 ===== */
    .topbar {
      background: var(--nav-bg);
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 16px;
      padding: 12px 24px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar h1 { font-size: 18px; color: #fff; letter-spacing: .5px; }
    .topbar .sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .top-meta { display: flex; align-items: center; gap: 16px; font-size: 13px; }
    #online-zones b { color: #60a5fa; font-size: 15px; }
    .nav-link {
      color: #cbd5e1;
      font-size: 12px;
      text-decoration: none;
      border: 1px solid #475569;
      border-radius: 999px;
      padding: 3px 12px;
    }
    .nav-link:hover { color: #fff; border-color: #94a3b8; }
    #conn { display: inline-flex; align-items: center; gap: 6px; color: #cbd5e1; }
    #conn .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--wait-accent);
    }
    #conn.on .dot { background: #22c55e; }
    #conn.off .dot { background: #ef4444; }

    /* ===== 主体布局：左上监测 + 右上3D预览，下方概览横跨 ===== */
    .layout {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 16px;
      padding: 16px 24px 24px;
      max-width: 1600px;
      margin: 0 auto;
    }
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .04);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .panel-head h2 { font-size: 15px; }
    .tag {
      font-size: 11px;
      color: #475569;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 1px 6px;
      margin-left: 8px;
      vertical-align: 2px;
    }
    .zone-id { font-size: 11px; color: var(--muted); font-family: Consolas, monospace; }

    /* ===== D1 多区域监测卡片 ===== */
    .monitor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }
    .zone-card {
      border: 1px solid var(--border);
      border-left: 4px solid var(--wait-accent);
      border-radius: 8px;
      padding: 12px;
      background: var(--wait-bg);
    }
    .zone-card .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .zone-card .card-head h3 { font-size: 15px; }
    .status-badge {
      font-size: 12px;
      color: #fff;
      background: var(--wait-accent);
      padding: 2px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .metrics { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
    .metrics li { font-size: 12px; color: var(--muted); }
    .metrics b {
      display: block;
      font-size: 15px;
      color: var(--text);
      font-weight: 600;
    }
    .metrics .time-cell {
      grid-column: 1 / -1;
      border-top: 1px dashed var(--border);
      padding-top: 6px;
      margin-top: 2px;
    }
    .zone-empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

    /* ===== E1 地图/3D 预览占位面板 ===== */
    .map3d {
      display: flex;
      gap: 12px;
      justify-content: space-around;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 18px 12px;
    }
    .map-block { flex: 1; text-align: center; }
    .map-block .cube {
      height: 72px;
      border-radius: 8px;
      background: var(--wait-bg);
      border: 1px solid var(--wait-accent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: background-color .25s;
    }
    .map-block .cube .b-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .map-block .cube .b-status { font-size: 12px; color: var(--text); }
    .panel-hint { margin-top: 10px; font-size: 12px; color: var(--muted); text-align: center; }
    .btn-3d {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 9px 0;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-3d:hover { background: #1d4ed8; }

    /* ===== 下方：事件与系统概览面板（D2/D3 预留） ===== */
    #panel-overview { grid-column: 1 / -1; }
    .overview-grid { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 16px; }
    .overview-grid h3 { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
    #zone-summary { list-style: none; display: grid; gap: 6px; font-size: 13px; }
    #zone-summary li {
      padding: 6px 8px;
      border-radius: 6px;
      border-left: 3px solid var(--wait-accent);
      background: #f8fafc;
    }
    #priority-zone { min-height: 64px; }
    .placeholder {
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      color: #94a3b8;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      text-align: center;
      min-height: inherit;
    }
    #event-list { list-style: none; font-size: 13px; max-height: 180px; overflow-y: auto; }
    #event-list li { padding: 5px 8px; border-bottom: 1px dashed var(--border); }
    #event-list li.empty { color: var(--muted); border: none; }
    .ev-time { font-family: Consolas, monospace; color: var(--muted); margin-right: 8px; font-size: 12px; }
    .ev-zone { font-weight: 600; }

    /* ===== D2 持续风险与优先关注 ===== */
    #panel-d2 { grid-column: 1 / -1; }
    .d2-priority { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .d2-priority .win-name { color: #c62828; }
    .d2-reason { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
    .d2-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .d2-table th, .d2-table td {
      padding: 6px 10px;
      border: 1px solid var(--border);
      text-align: center;
    }
    .d2-table th { background: #f8fafc; color: var(--muted); font-weight: 600; }
    .d2-table tr.winner td { background: #fff8e6; font-weight: 600; }

    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
      #panel-overview { grid-column: auto; }
      #panel-d2 { grid-column: auto; }
      .overview-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- ===== 顶部全局导航栏 ===== -->
  <header class="topbar">
    <div>
      <h1>AirGuard 空气质量与人流监测综合系统</h1>
      <div class="sub">Web 总视图门户 · MQTT 实时数据流底座（任务书 C02 V0.9R2）</div>
    </div>
    <div class="top-meta">
      <a class="nav-link" href="../mobile/mobile.html">移动端</a>
      <span id="online-zones">在线区域 <b>0</b>/3</span>
      <span id="conn"><span class="dot"></span><span id="conn-text">连接中…</span></span>
    </div>
  </header>

  <main class="layout">
    <!-- ===== 左上：多区域实时监测模块（D1 监测台） ===== -->
    <section class="panel" id="panel-monitor">
      <div class="panel-head">
        <h2>多区域实时监测<span class="tag">D1</span></h2>
      </div>
      <div id="monitor-cards" class="monitor-grid"></div>
    </section>

    <!-- ===== 右上：地图/3D 模块预览面板（E1） ===== -->
    <!-- 底部按钮跳转独立 3D 数字孪生页面 three3d/three-min.html -->
    <section class="panel" id="panel-3d">
      <div class="panel-head">
        <h2>校园空间视图（地图/3D 预览）<span class="tag">E1</span></h2>
      </div>
      <div id="map3d" class="map3d"></div>
      <p class="panel-hint">3D 色块与区域状态实时同步 · 完整数字孪生场景见独立页面</p>
      <button id="btn-open3d" class="btn-3d" type="button">进入 3D 校园视图 →</button>
    </section>

    <!-- ===== 下方：事件与系统概览面板（D2/D3 预留） ===== -->
    <section class="panel" id="panel-overview">
      <div class="panel-head">
        <h2>系统事件概览<span class="tag">D2 / D3</span></h2>
      </div>
      <div class="overview-grid">
        <div>
          <h3>区域最新状态摘要</h3>
          <ul id="zone-summary"></ul>
        </div>
        <div>
          <h3>优先关注区域</h3>
          <!-- D2 容器：渲染当前优先关注区域（calcPriority 结果） -->
          <div id="priority-zone" class="placeholder">待接入 D2 优先关注区域计算逻辑</div>
        </div>
        <div>
          <h3>事件记录</h3>
          <!-- D3 预留容器：事件状态机后续迭代，当前仅记录异常状态简易事件 -->
          <ul id="event-list"></ul>
        </div>
      </div>
    </section>

    <!-- ===== 下方：D2 持续风险与优先关注 ===== -->
    <section class="panel" id="panel-d2">
      <div class="panel-head">
        <h2>D2 持续风险与优先关注<span class="tag">D2</span></h2>
      </div>
      <div id="d2-priority" class="d2-priority"></div>
      <p id="d2-reason" class="d2-reason"></p>
      <table class="d2-table">
        <thead>
          <tr><th>区域</th><th>当前总分</th><th>连续异常次数</th><th>环境 status</th><th>crowdLevel</th><th>来源 / 置信度</th><th>标注</th></tr>
        </thead>
        <tbody id="d2-tbody"></tbody>
      </table>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      // ============ 配置 ============
      const MQTT_URL = 'ws://127.0.0.1:8083/mqtt';
      const TOPIC = 'airguard/+/env';
      // 独立 3D 数字孪生页面（web/ 上一级的 three3d/three-min.html）
      const THREE_PAGE_URL = '../three3d/three-min.html';

      // 区域配置：zoneId → 中文名
      const ZONES = {
        'zone-n': { name: '宿舍区' },
        'zone-s': { name: '教学区' },
        'zone-w': { name: '食堂区' },
      };
      const ZONE_IDS = Object.keys(ZONES);

      // zoneState：三个区域状态独立存储，只允许按 zone 键更新，严禁串数据
      // 条目结构：{ zoneId, pm25, co2, crowdLevel, time, status, receivedAt }
      const zoneState = ZONE_IDS.reduce(function (acc, z) { acc[z] = null; return acc; }, {});

      // status → 卡片背景色（任务书规定）；强调色用于徽章 / 色块边框
      const STATUS_BG = {
        '正常': '#e8f5e9',
        '轻度污染': '#fff8e1',
        '重度污染': '#ffebee',
        '通风不足风险': '#f3e5f5',
      };
      const STATUS_ACCENT = {
        '正常': '#2e7d32',
        '轻度污染': '#f57f17',
        '重度污染': '#c62828',
        '通风不足风险': '#7b1fa2',
      };
      const WAIT_BG = '#f5f5f5';
      const WAIT_ACCENT = '#9ca3af';

      // crowdLevel → 中文文案（仅展示，不参与 status 计算）
      const CROWD_LEVELS = { 0: '稀疏', 1: '正常', 2: '拥挤', 3: '严重拥挤' };

      // ============ D2 持续风险与优先关注 ============
      // crowdLevel 保留 source 标记：simulated / rule，置信度 1.0（规则判定直接采用上报值）
      // 打分规则写死在程序中，可解释、可重复：更换输入数据，优先区域随之变化
      const ENV_BASE_SCORE = { '重度污染': 10, '轻度污染': 6, '通风不足风险': 4, '正常': 0 };
      const CROWD_BONUS_SCORE = { 0: 0, 1: 1, 2: 3, 3: 5 }; // 3（严重拥挤）在拥挤之上延展 +5
      const PERSIST_BONUS = 2;        // 连续异常 ≥2 次的额外加成
      const PERSIST_THRESHOLD = 2;
      const STATUS_SEVERITY = { '重度污染': 3, '轻度污染': 2, '通风不足风险': 1, '正常': 0 };

      // 每个 zone 独立的 D2 状态（连续异常计数 + 风险总分），区域数据隔离、互不干扰
      const d2State = ZONE_IDS.reduce(function (acc, z) {
        acc[z] = { anomalyCount: 0, score: 0, source: 'simulated', confidence: 1.0, review: false };
        return acc;
      }, {});

      // 简易事件记录（D3 状态机后续迭代，当前仅记录异常状态变化）
      const eventLog = [];
      const EVENT_LOG_MAX = 100;

      // ============ DOM ============
      const $conn = document.getElementById('conn');
      const $connText = document.getElementById('conn-text');
      const $onlineZones = document.getElementById('online-zones');
      const $monitorCards = document.getElementById('monitor-cards');
      const $map3d = document.getElementById('map3d');
      const $zoneSummary = document.getElementById('zone-summary');
      const $eventList = document.getElementById('event-list');
      const $priorityZone = document.getElementById('priority-zone');
      const $d2Priority = document.getElementById('d2-priority');
      const $d2Reason = document.getElementById('d2-reason');
      const $d2Tbody = document.getElementById('d2-tbody');

      // ============ status 计算（任务书：按顺序判定，仅用 pm25 / co2） ============
      function calcStatus(pm25, co2) {
        if (pm25 > 150) return '重度污染';
        if (pm25 > 75) return '轻度污染';
        if (co2 >= 1500) return '通风不足风险';
        return '正常';
      }

      function crowdText(crowdLevel) {
        if (crowdLevel === undefined || crowdLevel === null || crowdLevel === '') return '--';
        const v = Number(crowdLevel);
        return Object.prototype.hasOwnProperty.call(CROWD_LEVELS, v) ? CROWD_LEVELS[v] : crowdLevel;
      }

      const fmt = function (x) { return (x === undefined || x === null || x === '' ? '--' : x); };

      // ============ 顶部连接状态指示器 ============
      function setConn(state, text) {
        $conn.className = state; // '' | 'on' | 'off'
        $connText.textContent = text || (
          state === 'on' ? '已连接 ' + MQTT_URL :
          state === 'off' ? '连接断开，自动重连中…' : '连接中…'
        );
      }

      // ============ 区域解析 ============
      // 数据契约字段为 zoneId；兼容旧版小写 zoneid；都缺失时退回 topic 中间段
      // （airguard/<zone>/env）；三者都不认识则丢弃该消息
      function resolveZone(topic, payload) {
        const z = (payload && (payload.zoneId || payload.zoneid)) || topic.split('/')[1] || '';
        return Object.prototype.hasOwnProperty.call(ZONES, z) ? z : null;
      }

      // ============ 消息处理 ============
      function onEnvMessage(topic, payload) {
        const zone = resolveZone(topic, payload);
        if (!zone) {
          console.warn('[AirGuard] 未知区域消息，已忽略:', topic);
          return;
        }
        const prev = zoneState[zone];
        const status = calcStatus(payload.pm25, payload.co2);
        // 只更新对应 zone 的条目，绝不写入其他区域
        zoneState[zone] = {
          zoneId: zone,
          pm25: payload.pm25,
          co2: payload.co2,
          crowdLevel: payload.crowdLevel,
          // crowdLevel 保留 source / confidence（报文可选字段，缺失按 README 声明默认处理）
          crowdSource: payload.crowdSource || 'simulated',
          crowdConfidence: (payload.crowdConfidence === undefined || payload.crowdConfidence === null || payload.crowdConfidence === '')
            ? null : Number(payload.crowdConfidence),
          time: payload.time,
          status: status,
          receivedAt: new Date(),
        };
        // D2：更新该 zone 的连续异常计数与风险总分（区域独立）
        updateD2(zone, status, payload.crowdLevel, payload.crowdSource, payload.crowdConfidence);

        // 简易事件记录：仅当状态变为异常（非“正常”）时追加一条，避免重复消息刷屏
        if (status !== '正常' && (!prev || prev.status !== status)) {
          eventLog.push({
            zone: zone, status: status,
            pm25: payload.pm25, co2: payload.co2,
            at: new Date(),
          });
          if (eventLog.length > EVENT_LOG_MAX) {
            eventLog.splice(0, eventLog.length - EVENT_LOG_MAX);
          }
        }
        renderAll();
      }

      // ============ 渲染：所有模块同源，只读 zoneState ============
      function renderAll() {
        renderTopbar();
        renderMonitor();
        renderMap3D();
        renderOverview();
        renderD2();
      }

      function renderTopbar() {
        const online = ZONE_IDS.filter(function (z) { return zoneState[z]; }).length;
        $onlineZones.innerHTML = '在线区域 <b>' + online + '</b>/' + ZONE_IDS.length;
      }

      // D1 监测卡片
      function renderMonitor() {
        $monitorCards.innerHTML = ZONE_IDS.map(function (zone) {
          const d = zoneState[zone];
          if (!d) {
            return '<section class="zone-card">' +
              '<div class="card-head"><h3>' + ZONES[zone].name +
              ' <span class="zone-id">' + zone + '</span></h3></div>' +
              '<p class="zone-empty">暂无实时数据</p>' +
              '</section>';
          }
          const bg = STATUS_BG[d.status] || WAIT_BG;
          const accent = STATUS_ACCENT[d.status] || WAIT_ACCENT;
          return '<section class="zone-card" style="background:' + bg + ';border-left-color:' + accent + '">' +
            '<div class="card-head"><h3>' + ZONES[zone].name +
            ' <span class="zone-id">' + zone + '</span></h3>' +
            '<span class="status-badge" style="background:' + accent + '">' + d.status + '</span></div>' +
            '<ul class="metrics">' +
            '<li>PM2.5<b>' + fmt(d.pm25) + '</b>μg/m³</li>' +
            '<li>CO₂<b>' + fmt(d.co2) + '</b>ppm</li>' +
            '<li>人流等级<b>' + crowdText(d.crowdLevel) + '</b></li>' +
            '<li>状态<b>' + d.status + '</b></li>' +
            '<li class="time-cell">上报时间<b>' + fmt(d.time) + '</b></li>' +
            '</ul>' +
            '</section>';
        }).join('');
      }

      // E1 地图/3D 预览色块：方块颜色跟随对应区域 status 实时变色
      function renderMap3D() {
        $map3d.innerHTML = ZONE_IDS.map(function (zone) {
          const d = zoneState[zone];
          const bg = d ? (STATUS_BG[d.status] || WAIT_BG) : WAIT_BG;
          const accent = d ? (STATUS_ACCENT[d.status] || WAIT_ACCENT) : WAIT_ACCENT;
          return '<div class="map-block">' +
            '<div class="cube" style="background:' + bg + ';border-color:' + accent + '">' +
            '<span class="b-name">' + ZONES[zone].name + '</span>' +
            '<span class="b-status">' + (d ? d.status : '暂无数据') + '</span>' +
            '</div>' +
            '<div class="zone-id">' + zone + '</div>' +
            '</div>';
        }).join('');
      }

      // 概览面板：区域最新状态摘要 + 简易事件列表
      function renderOverview() {
        $zoneSummary.innerHTML = ZONE_IDS.map(function (zone) {
          const d = zoneState[zone];
          if (!d) {
            return '<li style="border-left-color:' + WAIT_ACCENT + '">' +
              ZONES[zone].name + '（' + zone + '）：暂无数据</li>';
          }
          const accent = STATUS_ACCENT[d.status] || WAIT_ACCENT;
          const t = d.receivedAt.toLocaleTimeString('zh-CN', { hour12: false });
          return '<li style="border-left-color:' + accent + '">' +
            ZONES[zone].name + '（' + zone + '）：<b>' + d.status + '</b>' +
            '<span class="zone-id">　更新于 ' + t + '</span></li>';
        }).join('');

        if (eventLog.length === 0) {
          $eventList.innerHTML = '<li class="empty">暂无异常事件</li>';
          return;
        }
        $eventList.innerHTML = eventLog.slice().reverse().map(function (ev) {
          const t = ev.at.toLocaleTimeString('zh-CN', { hour12: false });
          return '<li><span class="ev-time">' + t + '</span>' +
            '<span class="ev-zone">' + ZONES[ev.zone].name + '（' + ev.zone + '）</span> → ' +
            ev.status + '（PM2.5 ' + fmt(ev.pm25) + ' · CO₂ ' + fmt(ev.co2) + '）</li>';
        }).join('');
      }

      // ============ D2：持续异常计数 + 可解释优先级打分 ============
      function updateD2(zone, status, crowdLevel, source, confidence) {
        const s = d2State[zone];
        // 连续异常计数：status 非“正常”视为异常报文，恢复正常则清零
        if (status !== '正常') s.anomalyCount += 1;
        else s.anomalyCount = 0;

        // source 保留与置信度规则（任务书 0.2 阈值）：
        // - simulated / rule / review：按 README 声明规则直接使用，置信度采用来源声明值 1.0（非伪造）
        // - model / template 等自动感知：confidence 低于 0.2 阈值或缺失 → 不得直接驱动优先处置，标注需人工复核
        const src = source || 'simulated';
        let conf = (confidence === undefined || confidence === null || confidence === '') ? null : Number(confidence);
        let review = false;
        if (src === 'simulated' || src === 'rule' || src === 'review') {
          conf = 1.0;
        } else if (conf === null || conf < 0.2) {
          review = true;
        }
        s.source = src;
        s.confidence = conf === null ? 0 : conf;
        s.review = review;

        // 风险分数 = 环境基础分 + 人流附加分 + 持续异常加成（需复核时人流分不计入）
        const crowdBonus = review ? 0 :
          (CROWD_BONUS_SCORE[Number(crowdLevel)] !== undefined ? CROWD_BONUS_SCORE[Number(crowdLevel)] : 0);
        let score = (ENV_BASE_SCORE[status] !== undefined ? ENV_BASE_SCORE[status] : 0) + crowdBonus;
        if (s.anomalyCount >= PERSIST_THRESHOLD) score += PERSIST_BONUS;
        s.score = score;
      }

      // 选出当前优先关注区域：总分高者优先；同分比连续异常次数；再同分按状态严重度
      function calcPriority() {
        const abnormal = ZONE_IDS.map(function (z) {
          const d = zoneState[z];
          return {
            zone: z,
            status: d ? d.status : '—',
            crowdLevel: d ? d.crowdLevel : null,
            anomalyCount: d2State[z].anomalyCount,
            score: d2State[z].score,
            review: d2State[z].review,
            abnormal: !!(d && d.status !== '正常'),
          };
        }).filter(function (e) { return e.abnormal; });
        if (abnormal.length === 0) return null; // 全部正常 → 无优先关注区域
        abnormal.sort(function (a, b) {
          if (b.score !== a.score) return b.score - a.score;
          if (b.anomalyCount !== a.anomalyCount) return b.anomalyCount - a.anomalyCount;
          return (STATUS_SEVERITY[b.status] || 0) - (STATUS_SEVERITY[a.status] || 0);
        });
        return abnormal[0];
      }

      // 判定理由：依据实际打分过程自动生成，可解释
      function buildPriorityReason(winner) {
        const reasons = [];
        reasons.push('综合风险得分最高（' + winner.score + ' 分），更值得优先处理');
        if (winner.review) reasons.push('人流数据置信度低于阈值，需人工复核');
        if (winner.status === '重度污染') reasons.push('环境状态严重度更高');
        if (Number(winner.crowdLevel) >= 2) reasons.push('人流密度等级更高（' + crowdText(winner.crowdLevel) + '）');
        if (winner.anomalyCount >= PERSIST_THRESHOLD) reasons.push('环境异常持续更久（已连续 ' + winner.anomalyCount + ' 次异常）');
        return reasons.join('；');
      }

      function renderD2() {
        const winner = calcPriority();
        if (!winner) {
          $priorityZone.innerHTML = '所有区域状态正常，无优先关注区域';
          $d2Priority.innerHTML = '';
          $d2Reason.textContent = '';
        } else {
          const reviewMark = winner.review ? ' <span class="win-name">（人流数据需人工复核）</span>' : '';
          $priorityZone.innerHTML = '当前优先关注：<b>' + ZONES[winner.zone].name + '</b>（' + winner.zone + '）' + reviewMark;
          $d2Priority.innerHTML = '当前优先关注：<span class="win-name">' +
            ZONES[winner.zone].name + '（' + winner.zone + '）</span>' + reviewMark;
          $d2Reason.textContent = '判定理由：' + buildPriorityReason(winner);
        }
        $d2Tbody.innerHTML = ZONE_IDS.map(function (z) {
          const d = zoneState[z];
          const s = d2State[z];
          const isWin = winner && winner.zone === z;
          return '<tr' + (isWin ? ' class="winner"' : '') + '>' +
            '<td>' + ZONES[z].name + '（' + z + '）</td>' +
            '<td>' + s.score + '</td>' +
            '<td>' + s.anomalyCount + '</td>' +
            '<td>' + (d ? d.status : '—') + '</td>' +
            '<td>' + (d ? crowdText(d.crowdLevel) : '—') + '</td>' +
            '<td>' + s.source + ' / ' + s.confidence + '</td>' +
            '<td>' + (s.review ? '需人工复核' : '—') + '</td>' +
            '</tr>';
        }).join('');
      }

      // TODO(D3): 事件状态机后续在此扩展（事件分级、去重、生命周期管理等）

      // E1 预览面板按钮：跳转独立 3D 数字孪生页面（three-min.html）
      document.getElementById('btn-open3d').addEventListener('click', function () {
        window.location.href = THREE_PAGE_URL;
      });

      // ============ MQTT 连接 ============
      const client = mqtt.connect(MQTT_URL, { reconnectPeriod: 5000 });

      client.on('connect', function () {
        setConn('on');
        client.subscribe(TOPIC, function (err) {
          if (err) console.error('[AirGuard] 订阅失败:', err);
        });
      });
      client.on('close', function () { setConn('off'); });
      client.on('offline', function () { setConn('off'); });
      client.on('reconnect', function () { setConn(''); });
      client.on('error', function (err) {
        console.error('[AirGuard] MQTT 错误:', err);
        setConn('off', '连接错误，自动重连中…');
      });
      client.on('message', function (topic, message) {
        try {
          // TextDecoder 兼容 Buffer / Uint8Array 两种 payload 形态
          const payload = JSON.parse(new TextDecoder().decode(message));
          if (!payload || typeof payload !== 'object' || Array.isArray(payload)) {
            throw new Error('payload 不是对象');
          }
          onEnvMessage(topic, payload);
        } catch (e) {
          // 错误 JSON 报文不崩溃页面，仅控制台输出错误
          console.error('[AirGuard] 消息解析失败:', e);
        }
      });

      renderAll(); // 初始渲染：所有模块显示等待状态
    })();
  </script>
</body>
</html>
